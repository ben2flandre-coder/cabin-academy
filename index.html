<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMBD Cabin Integration Academy</title><style>:root{--n:#08243f;--b:#126d9b;--p:#f3f7fa;--i:#142735;--l:#d9e3e9}*{box-sizing:border-box}body{margin:0;background:var(--p);font:16px/1.55 system-ui;color:var(--i)}header{background:var(--n);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:3;display:flex;justify-content:space-between}header button{background:transparent;color:#fff;border:1px solid #ffffff88}button{font:inherit;border:0;border-radius:7px;padding:10px 13px;background:var(--b);color:#fff;cursor:pointer}#menu{position:fixed;z-index:4;top:54px;left:0;width:285px;min-height:100vh;background:#fff;padding:16px;border-right:1px solid var(--l);transform:translateX(-100%);transition:.2s}#menu.open{transform:none}#menu button{display:block;width:100%;text-align:left;margin:5px 0;background:#fff;color:var(--i);border:1px solid var(--l)}main{max-width:850px;margin:auto;padding:24px 16px 82px}h1{font-size:clamp(2rem,7vw,3.8rem);line-height:1.05;margin:.2em 0}h2{margin-top:2em}.tag{font-weight:800;letter-spacing:.12em;color:var(--b);font-size:.75rem}.hero{background:var(--n);color:#fff;padding:32px;border-radius:0 0 22px 22px;margin:-24px -16px 20px}.hero p{font-size:1.12rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.box{background:#fff;border:1px solid var(--l);border-radius:10px;padding:16px}.card b{display:block}.card em{display:block;color:var(--b);font-size:.85rem}.atlas button{background:#fff;color:var(--i);border:1px solid var(--l);text-align:left;width:100%;margin:5px 0}.q button{background:#fff;color:var(--i);border:1px solid var(--l);text-align:left;width:100%;margin:7px 0}.ok{background:#e2f5e9!important}.bad{background:#ffe9e7!important}.warn{border-left:4px solid #e39b2f;padding:10px 15px;background:#fff8eb}blockquote{border-left:4px solid var(--b);padding:10px 16px;background:#fff;margin:12px 0}svg{width:100%;background:#e8f4f8;border-radius:12px;padding:10px;stroke:var(--b);stroke-width:3;fill:none}svg text{stroke:none;fill:var(--n);font-weight:800;font-size:14px}table{border-collapse:collapse;width:100%;background:#fff;font-size:.9rem}td,th{border:1px solid var(--l);padding:8px;text-align:left;vertical-align:top}input,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:6px;font:inherit;margin:5px 0}textarea{min-height:100px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);display:flex;justify-content:space-around;padding:5px;z-index:3}.bottom button{background:none;color:var(--n);font-size:.75rem;padding:7px}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding:25px}.hero h1{font-size:2rem}table{display:block;overflow:auto}}</style><header><b>RMBD · Cabin Integration Academy</b><button onclick="menu.classList.toggle('open')">Parcours</button></header><aside id="menu"></aside><main id="app"></main><nav class="bottom"><button onclick="home()">Accueil</button><button onclick="learn(0)">Apprendre</button><button onclick="atlas()">Atlas</button><button onclick="revise()">Réviser</button><button onclick="logbook()">Carnet</button></nav><script>const S=JSON.parse(localStorage.rmbdCabin||'{"done":{},"notes":[]}'),save=()=>localStorage.rmbdCabin=JSON.stringify(S);const L=[['L’avion et son environnement','Comprendre l’aéronef avant de comprendre la cabine.','Fuselage|Fuselage|Corps principal ; il accueille cockpit, cabine et soutes.','Cadre|Frame|Élément transversal de structure, utile au repérage.','Lisse|Stringer|Élément longitudinal de structure.','Fuselage, cabine, cockpit, soutes, portes et issues : je situe une zone par des repères croisés.','Une paroi intérieure : tu identifies d’abord…','sa couleur|structure ou habillage, puis zone et repères|son prix',1],['La cabine et ses équipements','Reconnaître ce qui compose l’espace passager.','Siège passager|Passenger seat|Équipement fixé sur interface définie.','PSU|Passenger service unit|Bandeau supérieur avec fonctions passagers selon configuration.','Coffre à bagages|Overhead bin / hatrack|Rangement supérieur sensible aux chocs.','Je relie toujours : nom → fonction → localisation → interfaces → vigilances.','Lecture robuste d’un équipement ?','nom → fonction → localisation → interfaces|couleur|je le pose puis cherche le plan',0],['Dossier et environnement industriel','Lire l’information qui autorise une action.','Référence pièce|Part number / P/N|Identifie la définition d’un article.','N° de série|Serial number / S/N|Identifie individuellement un article lorsque prévu.','Révision|Revision / REV|État de modification du document.','P/N, S/N, lot, nomenclature, gamme, traçabilité et configuration ne se devinent pas.','Qu’est-ce qui confirme une instruction applicable ?','date du cours|indice/révision et validation pour la situation|nombre de pages',1],['Outillage, matériel et zone','Préparer sans créer de risque.','Clé dynamométrique|Torque wrench|Applique un serrage prescrit ; plage et validité adaptées.','Pied à coulisse|Vernier caliper|Mesure : lire ne suffit pas, il faut le critère.','EPI / EPC|PPE / collective protection|Les protections ne sont pas interchangeables.','Je prépare protection produit, accès, coactivité, moyens, propreté et inventaire.','Une clé d’identification douteuse ?','je l’utilise|je l’isole et j’alerte|je l’emprunte sans trace',1],['Gestes et logique d’intégration','Raisonner une action avant de l’exécuter.','Positionner|Positioning|Présenter par rapport aux références définies.','Ajuster|Fitting|Atteindre une relation prescrite, sans retouche improvisée.','Autocontrôle|Self-inspection|Vérification avant passage de relais.','AVANT : préparer, identifier, protéger. ACTION : acheminer, présenter, fixer selon prescription. APRÈS : contrôler, nettoyer, inventorier, tracer.','Ordre le plus sûr ?','fixer puis regarder|préparer → identifier → protéger → positionner → contrôler → tracer|forcer puis demander',1],['Systèmes et interfaces','Observer les liaisons sans inventer de critère Airbus.','Faisceau|Wire harness|Ensemble organisé de conducteurs et protections.','Connecteur|Connector|Interface à identifier et préserver.','Détrompeur|Key / keyway|Empêche une mauvaise orientation.','Faisceaux, cheminements, connecteurs, colliers et protections sont observés ; aucune valeur technique n’est déduite ici.','Un connecteur résiste : tu…','forces légèrement|vérifies l’identification puis stoppes si le doute persiste|changes de connecteur',1],['FOD, qualité et sécurité','Prévenir, détecter et signaler.','FOD|Foreign Object Debris / Damage|Objet, débris ou dommage étranger pouvant affecter produit, qualité ou sécurité.','Non-conformité|Nonconformity / NC|Exigence applicable non satisfaite.','Stop work|Stop work|Suspendre face à une condition essentielle absente.','Une vis apparaît au sol : je sécurise, recherche l’origine, inventorie et signale ; je ne clôture pas la zone.','Une pièce non identifiée est trouvée après montage. Premier réflexe ?','la jeter|la mettre en poche|stopper la clôture, sécuriser et appliquer le processus',2]];function nav(){menu.innerHTML='<b>PARCOURS GUIDÉ</b>'+L.map((x,i)=>'<button onclick="learn('+i+')">'+String(i+1).padStart(2,'0')+' · '+x[0]+' '+(S.done[i]?'✓':'')+'</button>').join('')+'<hr><button onclick="atlas()">Atlas visuel</button><button onclick="revise()">Révision & matrice</button><button onclick="logbook()">Carnet local</button><button onclick="sources()">Sources & limites</button>'}function diagram(n){return n==0?'<svg viewBox="0 0 600 220"><path d="M35 115h160L275 45h45l-35 70h220l55 25-55 25H285l35 70h-45l-80-70H35z"/><text x="245" y="32">FUSELAGE</text><text x="420" y="105">AILE</text><text x="220" y="205">EMPENNAGE</text></svg>':n==1?'<svg viewBox="0 0 600 220"><path d="M60 190Q60 35 300 25Q540 35 540 190Z"/><path d="M100 175h400M145 75h90v50h-90m225-50h90v50h-90M260 80h80v45h-80M165 145h70v30h-70m200-30h70v30h-70"/><text x="145" y="65">COFFRE</text><text x="280" y="70">PSU</text><text x="175" y="140">SIÈGE</text></svg>':'<svg viewBox="0 0 600 160"><path d="M50 80h500"/><circle cx="100" cy="80" r="27"/><circle cx="250" cy="80" r="27"/><circle cx="400" cy="80" r="27"/><circle cx="540" cy="80" r="27"/><text x="70" y="140">AVANT</text><text x="220" y="140">ACTION</text><text x="360" y="140">CONTRÔLE</text><text x="515" y="140">TRACE</text></svg>'}function home(){nav();app.innerHTML='<section class="hero"><p class="tag">COMPAGNON DE FORMATION · CQP INTÉGRATEUR CABINE</p><h1>Entrer dans le métier, étape par étape.</h1><p>Tu vois, tu nommes, tu comprends, tu t’entraînes. Ce n’est pas une procédure Airbus : les consignes applicables viennent toujours de la formation et de l’entreprise.</p><button onclick="learn(0)">Commencer le parcours</button></section><h2>Ton itinéraire</h2>'+L.map((x,i)=>'<button class="box" style="display:block;width:100%;text-align:left;margin:8px 0" onclick="learn('+i+')"><b>'+String(i+1).padStart(2,'0')+' · '+x[0]+'</b><small>'+x[1]+'</small></button>').join('')}function learn(i){nav();menu.classList.remove('open');let m=L[i],w=m.slice(2,5).map(x=>{let a=x.split('|');return '<article class="card"><b>'+a[0]+'</b><em>'+a[1]+'</em><p>'+a[2]+'</p></article>'}).join('');app.innerHTML='<section class="hero"><p class="tag">MODULE '+String(i+1).padStart(2,'0')+' / 7</p><h1>'+m[0]+'</h1><p>'+m[1]+'</p><button onclick="document.querySelector('#course').hidden=false">Étudier ce module</button></section><section id="course" hidden>'+diagram(i)+'<h2>1. Ce que tu vas apprendre</h2><p>'+m[1]+'</p><h2>2. Découverte visuelle</h2><p>Lis le schéma puis retrouve les objets réels pendant la formation.</p><h2>3. Vocabulaire FR / EN</h2><div class="grid">'+w+'</div><h2>4. Exemple concret</h2><blockquote>'+m[5]+'</blockquote><h2>5. À toi de jouer</h2><div class="card q"><b>'+m[6]+'</b>'+m[7].split('|').map((x,n)=>'<button data-q="'+n+'">'+x+'</button>').join('')+'<p id="fb"></p></div><h2>6. Erreurs fréquentes</h2><p class="warn">Ne pas déduire une valeur, une référence, une configuration ou une procédure à partir de ce support. En cas de doute : arrêter, protéger, demander.</p><h2>7. Situation professionnelle</h2><blockquote>Explique à voix haute : ce que tu observes, l’information dont tu as besoin, ton action, ton contrôle et la trace attendue.</blockquote><button onclick="S.done['+i+']=true;save();'+(i<6?'learn('+(i+1)+')':'revise()')+'">'+(i<6?'Valider et passer au module suivant':'Passer à la révision')+'</button></section>';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let ok=+b.dataset.q===m[8];fb.innerHTML=ok?'<b>Bonne décision.</b> Tu mobilises la notion enseignée.':'<b>À reprendre.</b> Relis l’exemple, puis recommence.';b.className=ok?'ok':'bad';document.querySelectorAll('[data-q]').forEach(x=>x.disabled=true)})}function atlas(){nav();app.innerHTML='<p class="tag">ATLAS VISUEL</p><h1>Reconnaître avant d’agir</h1>'+diagram(1)+'<div class="atlas"><button onclick="show('Siège passager','Passenger seat','Localisation cabine ; interfaces selon configuration ; vigilance : protection des surfaces et dossier applicable.')">Siège passager</button><button onclick="show('PSU','Passenger Service Unit','Bandeau supérieur ; ne pas déduire de fonction ou d’interface sans dossier.')">PSU</button><button onclick="show('Coffre','Overhead bin','Rangement supérieur ; vigilance choc, alignement et protection.')">Coffre à bagages</button><button onclick="show('Galley','Galley','Module de service ; interfaces mécaniques et systèmes propres à la configuration.')">Galley</button><button onclick="show('Lavatory','Lavatory','Module sanitaire ; zones et interfaces à confirmer.')">Lavatory</button><button onclick="show('Clé dynamométrique','Torque wrench','Serrage seulement selon prescription : identification, plage et validité.')">Clé dynamométrique</button></div><div id="detail" class="card">Choisis un objet : nom FR, nom EN, fonction, localisation, interfaces, risques et vigilance apparaissent ici.</div>'}function show(a,b,c){detail.innerHTML='<b>'+a+'</b><em>'+b+'</em><p><b>Fonction / localisation / interfaces :</b> '+c+'</p><p><b>Vigilance :</b> aucune valeur ni procédure Airbus n’est fournie par la plateforme.</p>'}function revise(){nav();app.innerHTML='<p class="tag">RÉVISION & CERTIFICATION</p><h1>Relier apprentissage, exercice et compétence</h1><table><tr><th>Chapitre</th><th>Savoir</th><th>Savoir-faire</th><th>Exercice / preuve</th></tr>'+L.map((x,i)=>'<tr><td>M'+(i+1)+' · '+x[0]+'</td><td>'+x[1]+'</td><td>Observer, nommer, décider et contrôler</td><td>QCM contextualisé + explication orale</td></tr>').join('')+'</table><h2>Oral blanc</h2><div class="card"><p>Choisis une situation réelle vécue ou observée et réponds : contexte → préparation → action → contrôle → trace → ce que tu demandes au tuteur.</p><button onclick="this.nextElementSibling.hidden=false">Afficher la grille</button><ul hidden><li>J’emploie le vocabulaire précis.</li><li>Je distingue fait, doute et décision.</li><li>Je cite le contrôle attendu.</li><li>Je ne me présente pas comme certifiée.</li></ul></div>'}function logbook(){nav();app.innerHTML='<p class="tag">CARNET LOCAL</p><h1>Transformer une journée en apprentissage</h1><p>Ne saisis aucune donnée confidentielle Airbus.</p><form id="f"><input name="t" placeholder="Situation observée ou réalisée" required><textarea name="n" placeholder="Contexte → action → contrôle → ce que je retiens" required></textarea><button>Enregistrer sur cet appareil</button></form>'+S.notes.slice().reverse().map(n=>'<article class="card"><b>'+n.t+'</b><p>'+n.n+'</p></article>').join('');f.onsubmit=e=>{e.preventDefault();S.notes.push(Object.fromEntries(new FormData(f)));save();logbook()}}function sources(){nav();app.innerHTML='<p class="tag">SOURCES & LIMITES</p><h1>Fiabilité du support</h1><div class="card"><b>Référentiel officiel</b><p>RNCP40664 : référentiel de certification du CQP Intégrateur cabine aéronautique.</p></div><div class="card"><b>Connaissances générales et contenus RMBD</b><p>Vocabulaire, schémas originaux, cas pédagogiques et entraînements. Les éléments propres à Airbus doivent être confirmés en formation ou en entreprise.</p></div><div class="card"><b>Règle d’arrêt</b><p>Information essentielle manquante, document douteux, écart, dommage, objet non identifié ou risque : je stoppe, protège et demande le cadre applicable.</p></div>'}home()</script></html>
