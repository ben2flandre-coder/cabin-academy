<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMBD Cabin Academy</title><style>body{margin:0;font:16px/1.5 system-ui;background:#f3f7fa;color:#152838}header{padding:16px;background:#09233d;color:#fff;position:sticky;top:0}main{max-width:720px;margin:auto;padding:22px}h1{font-size:2.3rem;line-height:1.05}.card{background:#fff;border:1px solid #d7e1e8;border-radius:10px;padding:16px;margin:14px 0}.tag{color:#1674a5;font-weight:800;font-size:.75rem;letter-spacing:.1em}.word{border-left:4px solid #1674a5;padding:10px;margin:7px 0;background:#f8fbfc}button{padding:11px 14px;border:0;border-radius:7px;background:#1674a5;color:#fff;font-weight:700;font:inherit}.q button{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;border:1px solid #d7e1e8;color:#152838}@media(max-width:600px){main{padding:16px}h1{font-size:2rem}}</style><header><b>RMBD · Cabin Integration Academy</b></header><main id="a"></main><script>const M=[["Lire l’avion","Fuselage · cadre / frame · lisse / stringer · cabine · cockpit · soute","Avant d’agir, je situe la zone et je croise les repères.","Une paroi intérieure : première distinction ?","Couleur|Structure ou habillage, puis zone et repères|Prix",1],["Découvrir la cabine","Sièges · PSU · coffres / overhead bins · galley · lavatory","Je lis : nom → fonction → localisation → interfaces → vigilance.","Lecture robuste d’un équipement ?","Nom → fonction → localisation → interfaces|Couleur|Je le pose puis cherche le plan",0],["Comprendre le dossier","P/N · S/N · révision · nomenclature · gamme","Une action correcte avec le mauvais document est non conforme.","Qu’est-ce qui confirme une instruction applicable ?","Date du cours|Indice/révision et validation pour la situation|Nombre de pages",1],["Préparer le poste","Zone · protections · outillage · EPI/EPC · coactivité","Un moyen douteux est mis de côté et signalé.","Clé à identification douteuse ?","Je l’utilise|Je l’isole et alerte|Je l’emprunte sans trace",1],["Logique d’intégration","AVANT → ACTION → CONTRÔLE → TRACE","Une résistance anormale impose arrêt et vérification, jamais forçage.","Ordre le plus sûr ?","Fixer puis regarder|Préparer → identifier → protéger → positionner → contrôler → tracer|Forcer puis demander",1],["Systèmes et interfaces","Faisceau · connecteur · détrompeur · collier · frottement","Un connecteur résistant n’est jamais forcé.","Face à un connecteur qui résiste…","Je force|Je vérifie puis stoppe si doute|Je change de connecteur",1],["FOD, qualité et sécurité","FOD · non-conformité · traçabilité · stop work","Une pièce non identifiée : sécuriser, rechercher l’origine, inventorier, signaler.","Pièce trouvée après montage ?","La jeter|La mettre en poche|Stopper la clôture et appliquer le processus",2]];let i=0;function r(){let m=M[i];a.innerHTML=`<p class="tag">PARCOURS GUIDÉ · MODULE ${i+1}/7</p><h1>${m[0]}</h1><p>${m[1]}</p><button id="go">Étudier ce module</button><section id="l" hidden><div class="card"><b>Pourquoi c’est important</b><p>${m[2]}</p></div><div class="card"><b>Vocabulaire métier FR / EN</b><div class="word">Document applicable · Applicable document</div><div class="word">Autocontrôle · Self-inspection</div><div class="word">Traçabilité · Traceability</div></div><div class="card q"><b>À toi de jouer</b><p>${m[3]}</p>${m[4].split("|").map((x,n)=>`<button data-x="${n}">${x}</button>`).join("")}<p id="f"></p></div><button id="n">${i<6?"Module suivant":"Revenir au début"}</button></section>`;go.onclick=()=>l.hidden=false;document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{let ok=+b.dataset.x===m[5];f.innerHTML=ok?"Bonne décision : notion mobilisée.":"À reprendre : relis le module puis recommence.";document.querySelectorAll("[data-x]").forEach(x=>x.disabled=true)});n.onclick=()=>{i=(i+1)%7;r();scrollTo(0,0)}}r()</script>
