<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Freinage : fil à freiner, goupille fendue, vernis témoin</title>
  <desc id="d">En haut à gauche, bon montage d'un fil à freiner entre deux têtes de vis percées vues de dessus : le fil torsadé part du haut de la première tête et arrive par le bas de la seconde, de sorte que la traction du fil tire chaque vis dans le sens du serrage indiqué par les flèches ; la torsade finale est repliée. En haut à droite, montage inversé à ne pas faire : le fil tirerait les vis dans le sens du desserrage. En bas à gauche, écrou à créneaux vu de côté, traversé par une goupille fendue dont les deux branches sont rabattues. En bas au centre, un trait de vernis témoin continu passe de l'écrou à la pièce ; en bas à droite, le trait est décalé : l'écrou a tourné.</desc>
