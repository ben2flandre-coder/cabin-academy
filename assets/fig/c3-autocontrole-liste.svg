<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 744" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Liste d'autocontrôle fictive</title>
  <desc id="d">Document fictif pédagogique. Fiche intitulée AUTOCONTRÔLE EX-OP 040. Six lignes, chacune précédée d'une case : bonne pièce, bon indice, cochée ; position et sens de montage, cochée ; fixations toutes présentes, cochée ; aspect, ni choc ni rayure, cochée ; zone propre, rien d'oublié, non cochée ; outils comptés et rangés, cochée. En bas, une ligne Nom et Date restée vide.</desc>
