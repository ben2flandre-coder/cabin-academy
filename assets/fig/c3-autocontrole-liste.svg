    <rect class="wh" x="48" y="170" width="50" height="50" rx="6"/>
    <path class="dim" d="M58 196 l12 14 l22 -30"/>
  </g>
  <text class="ts" x="118" y="208" pointer-events="none">Bonne pièce, bon indice</text>
  <g data-part="l-position">
