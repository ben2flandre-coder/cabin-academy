  <rect class="wh" x="16" y="14" width="968" height="716" rx="18"/>
  <g data-part="entete">
    <rect class="in" x="32" y="28" width="936" height="120" rx="12"/>
  </g>
  <text class="tb" x="52" y="76" pointer-events="none">AUTOCONTRÔLE · EX-OP 040</text>
  <text class="ts" x="52" y="126" pointer-events="none">DOCUMENT FICTIF — PÉDAGOGIQUE</text>
  <g data-part="l-identite">
