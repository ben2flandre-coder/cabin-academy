<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Huit têtes de vis vues de dessus</title>
  <desc id="d">Huit têtes de vis rondes vues de dessus, sur deux rangées de quatre. Rangée du haut : empreinte à fente (une rainure droite qui traverse la tête) ; empreinte cruciforme Phillips (croix dont les branches s'affinent vers l'extérieur, angles intérieurs arrondis) ; empreinte cruciforme Pozidriv (croix à branches droites avec quatre fins traits rayonnants à 45 degrés entre les branches) ; empreinte six lobes de type Torx (étoile à six lobes arrondis). Rangée du bas : empreinte six pans creux (creux hexagonal) ; empreinte cruciforme à branches décalées (quatre branches qui ne sont pas alignées deux à deux, comme les ailes d'un moulin) ; empreinte à trois ailes (trois branches décalées, à 120 degrés) ; tête hexagonale posée sur une rondelle, que l'on entraîne par l'extérieur.</desc>
