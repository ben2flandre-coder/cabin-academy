<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six têtes de vis vues de dessus</title>
  <desc id="d">Six têtes de vis rondes vues de dessus, sur deux rangées. Rangée du haut : empreinte à fente (une rainure droite qui traverse la tête), empreinte cruciforme Phillips (croix dont les branches s'affinent vers l'extérieur, angles intérieurs arrondis), empreinte cruciforme Pozidriv (croix à branches droites avec quatre fins traits rayonnants à 45 degrés entre les branches). Rangée du bas : empreinte six lobes de type Torx (étoile à six lobes arrondis), empreinte six pans creux (creux hexagonal), tête hexagonale posée sur une rondelle, que l'on entraîne par l'extérieur.</desc>
  <rect class="bgp" width="1000" height="600"/>
  <g data-part="fente">
    <circle class="mt" cx="185" cy="165" r="120"/>
    <circle class="thin" cx="185" cy="165" r="107"/>
    <path class="dk" d="M65.9 150 L304.1 150 A120 120 0 0 1 304.1 180 L65.9 180 A120 120 0 0 1 65.9 150 Z"/>
  </g>
  <g data-part="phillips">
    <circle class="mt" cx="500" cy="165" r="120"/>
    <circle class="thin" cx="500" cy="165" r="107"/>
