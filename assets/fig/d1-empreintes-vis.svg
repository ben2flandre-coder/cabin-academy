    <path class="ln2" d="M833.4 183.4 L871.6 221.6"/>
    <path class="ln2" d="M796.6 183.4 L758.4 221.6"/>
    <path class="ln2" d="M796.6 146.6 L758.4 108.4"/>
    <path class="ln2" d="M833.4 146.6 L871.6 108.4"/>
  </g>
