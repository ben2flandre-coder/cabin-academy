<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
<title id="t">Lire un réglet au millimètre, et éviter la parallaxe</title>
<desc id="d">Trois rangées. Rangée du haut : une pièce A est posée contre un réglet gradué en millimètres et chiffré en centimètres ; elle est en butée contre une cale à gauche, au zéro du réglet, et son autre bout tombe quatre traits après le chiffre 3. Rangée du milieu : une pièce B est posée contre le même réglet, mais elle commence au chiffre 2 et finit sept traits après le chiffre 6. Rangée du bas : vue de profil, avec l'épaisseur du réglet exagérée ; le réglet dépasse du bord d'une pièce. Un œil vert placé juste au-dessus du bord vise droit et lit le bon trait ; un œil rouge placé de côté vise en biais et lit un trait décalé : c'est l'erreur de parallaxe.</desc>
