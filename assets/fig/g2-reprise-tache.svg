<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Interrompre une tâche proprement : ce qu'on laisse derrière soi</title>
  <desc id="d">Schéma de principe d'un poste au moment d'une interruption. En haut, vue de profil d'un panneau fixé par six vis : les trois premières sont en appui, la quatrième est en appui elle aussi mais rien ne dit si elle a reçu son serrage final, les deux dernières sont seulement engagées et dépassent. Une étiquette marquée ICI pointe la quatrième vis : c'est le repère de reprise. Une balise orange EN COURS est accrochée au panneau. À droite, une extrémité de tuyauterie est fermée par un obturateur rouge. En bas, une note de passation avec des lignes cochées et une ligne non cochée, et une caisse à outils refermée marquée d'une coche verte.</desc>
