<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Cellule de toilettes, vue de dessus</title>
  <desc id="d">Schéma de principe d'une cellule de toilettes vue de dessus. La coque forme une petite pièce fermée, arrondie du côté de la paroi de l'avion. La porte pliante et son verrou donnent sur le couloir. À l'intérieur : la cuvette, un meuble lavabo avec sa vasque, un miroir le long de la cloison, une poubelle à volet intégrée au meuble, et un détecteur de fumée au plafond. Deux raccordements sortent de la cellule : l'arrivée d'eau et le tuyau d'évacuation.</desc>
  <rect class="bgp" width="1000" height="730"/>
  <text class="ts" x="30" y="50">Côté paroi de l’avion</text>
  <text class="ts tc" x="500" y="704">Côté couloir</text>
