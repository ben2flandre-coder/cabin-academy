<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 708" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les équipements de protection individuelle de base à reconnaître</title>
  <desc id="d">Schéma de principe. À gauche, une personne debout, de face, en tenue de travail fermée, qui porte tous ses équipements : casquette, lunettes, protections sur les oreilles, gants, genouillères et chaussures. À droite, six vignettes montrent chaque équipement en grand : des lunettes de protection avec leurs coques latérales ; un casque antibruit à deux coquilles et une paire de bouchons d'oreille reliés par un cordon ; un gant de travail ; une chaussure de sécurité vue de côté, dont le bout renforcé est dessiné en clair ; une casquette anti-heurt vue de côté, avec en pointillés la coque rigide cachée à l'intérieur ; une jambe pliée, genou au sol, protégée par une genouillère.</desc>
