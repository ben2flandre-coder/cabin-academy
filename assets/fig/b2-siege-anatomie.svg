<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Siège passager triple : vue de côté et vue de face</title>
  <desc id="d">Schéma de principe d'un siège passager de classe économique. À gauche, vue de côté, avant de l'avion à gauche : coussin d'assise, dossier légèrement incliné vers l'arrière avec son appui-tête, accoudoir, tablette repliée et poche au dos du dossier, ceinture posée sur l'assise, armature faite de deux tubes transversaux sous l'assise, pied avant vertical et pied arrière incliné terminés chacun par une ferrure engagée dans le rail de siège, barre de retenue des bagages à l'avant près du sol, boîtier électronique sous l'assise relié par un câble qui longe le rail. À droite, vue de face du même siège triple : trois places côte à côte, quatre accoudoirs, une armature commune et seulement deux pieds posés sur deux rails.</desc>
  <rect class="bgp" width="1000" height="700"/>
