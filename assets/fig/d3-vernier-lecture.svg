<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
<title id="t">Lire un vernier au dixième de millimètre</title>
<desc id="d">Deux vues très agrandies de la zone de lecture d'un pied à coulisse à vernier au dixième. En haut de chaque vue, la règle graduée en millimètres, chiffrée tous les dix millimètres. En dessous, le vernier, une petite échelle de dix divisions numérotée 0, 5 et 10. Exemple A, résolu : le zéro du vernier est juste après le quatorzième trait de la règle, et c'est le troisième trait du vernier qui tombe exactement en face d'un trait de la règle ; la mesure vaut 14,3 millimètres. Exemple B, non résolu : le zéro du vernier se trouve entre 31 et 32, et il faut chercher quel trait du vernier coïncide avec un trait de la règle.</desc>
<rect class="bgp" width="1000" height="760"/>
<text class="tl" x="20" y="62">A</text>
