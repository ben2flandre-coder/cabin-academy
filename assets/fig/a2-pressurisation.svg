<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" class="fig" role="img" aria-labelledby="t d">
  <title id="t">La zone pressurisée du fuselage et le cycle de pressurisation</title>
  <desc id="d">Schéma de principe en deux parties. En haut, un fuselage vu de côté, avant à gauche : la zone pressurisée, en bleu clair, va de la cloison étanche avant, juste derrière le nez, jusqu'à la cloison étanche arrière, bombée ; elle englobe le poste, la cabine et les soutes. De petites flèches montrent l'air intérieur qui pousse la peau vers l'extérieur. Hors de cette zone : le nez avec son radôme, le cône arrière, et au milieu du ventre la zone du caisson de voilure et des logements de train. En bas, une courbe en trois bosses identiques : à chaque vol, l'écart de pression monte, reste stable en croisière, puis redescend ; un vol égale un cycle.</desc>
