<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Une porte passagers vue de l'intérieur de la cabine</title>
  <desc id="d">Schéma de principe générique d'une porte passagers fermée, vue depuis la cabine ; la forme et la place des commandes changent d'un avion à l'autre. Au centre, le vantail de la porte dans son encadrement renforcé. Au-dessus, un signe lumineux vert marqué EXIT. Dans le vantail, de haut en bas : un petit hublot d'observation ; une grande poignée de manœuvre ; à gauche, un petit boîtier avec un levier, le levier d'armement du toboggan, entre une case rouge et une case verte ; en bas, un gros carter qui contient le toboggan d'évacuation plié. Sous la porte, le seuil métallique strié. Devant la porte, sur le plancher, une surface hachurée : le passage à garder libre. À droite de la porte, une poignée d'assistance verticale puis un siège équipage replié contre la paroi. À gauche, le bord d'un meuble de cabine.</desc>
