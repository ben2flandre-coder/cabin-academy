<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six façons pour un objet d'arriver là où on ne le cherche pas</title>
  <desc id="d">Planche de six schémas de principe. Tomber : une vis tombe par un interstice entre deux panneaux de plancher. Rouler : une rondelle roule sur un sol légèrement incliné et file sous un meuble. Être enfermé : un tournevis est resté dans une cavité dont on referme le panneau d'accès. Être transporté : un débris est planté dans la semelle d'une chaussure qui avance. Être aspiré : une étiquette est entraînée par le courant d'air dans l'extrémité ouverte d'un conduit. Être recouvert : un écrou, dessiné en pointillé, est caché sous une protection souple posée sur le plancher.</desc>
