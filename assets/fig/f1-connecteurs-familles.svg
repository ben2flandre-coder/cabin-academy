<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Connecteurs : verrouillages, contacts, détrompage, protection</title>
  <desc id="d">Planche de six dessins. En haut à gauche, connecteur circulaire à baïonnette vu de côté : la bague porte une rampe inclinée terminée par un trou, l'embase porte un ergot ; une flèche courte indique une fraction de tour. En haut au centre, connecteur circulaire à verrouillage fileté : l'embase porte un filetage, une flèche en spirale indique plusieurs tours. En haut à droite, coupe d'un contact femelle, la douille, tube creux logé dans son isolant, face à un contact mâle, la broche, tige pleine qui dépasse de son isolant. En bas à gauche, connecteur rectangulaire vu de face : coque en trapèze, deux rangées de contacts, une vis de verrouillage à chaque extrémité ; dessous, deux croquis montrent le trapèze qui entre dans le bon sens et qui bute dans le mauvais sens. En bas au centre, connecteur rectangulaire à loquet vu de côté : une languette élastique accroche un bossage, une flèche montre où appuyer pour libérer. En bas à droite, connecteur en attente fermé par un bouchon de protection retenu par un cordon.</desc>
