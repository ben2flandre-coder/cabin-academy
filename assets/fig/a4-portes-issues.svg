<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Portes et issues d'un avion de ligne, vue de dessus</title>
  <desc id="d">Schéma de principe d'un avion monocouloir vu de dessus, avant à gauche : le côté gauche (LH) est en bas, le côté droit (RH) en haut. Sur le côté gauche, deux portes passagers, une à l'avant et une à l'arrière. En face, sur le côté droit, deux portes de service. Au milieu, au-dessus de chaque aile, une issue de secours sur l'aile ; une flèche montre le chemin d'évacuation sur l'aile vers son bord arrière. Sur le côté droit, deux portes de soute dessinées plus sombres : elles sont plus bas, sous le niveau du plancher cabine. Deux toboggans orange sont déployés, l'un à la porte avant droite, l'autre à la porte arrière gauche. Dans la cabine, des pointillés montrent l'allée et les passages transversaux qui mènent à chaque issue. À l'avant, la porte du poste de pilotage ferme la cloison entre cabine et cockpit.</desc>
