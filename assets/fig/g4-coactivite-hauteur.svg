<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Coactivité : un autre métier travaille au-dessus de toi</title>
  <desc id="d">Schéma de principe, vue de côté. Au centre, un collègue d'un autre métier travaille bras levés dans une trappe du plafond, debout sur une plateforme roulante à garde-corps. Son outil est retenu par une longe. Un écrou tombe de la plateforme. Au sol, sous la plateforme et autour, une bande zébrée rouge et blanche marque la zone de chute d'objets, limitée par des pointillés verticaux. De chaque côté, des potelets reliés par une chaîne barrent le passage, avec un panneau rond d'interdiction aux piétons. À gauche, hors de la zone, une personne lève la main et demande « J'entre ? » avant d'avancer.</desc>
