<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Zone ouverte avant fermeture : que reste-t-il à voir ?</title>
  <desc id="d">Scène de principe : une ouverture dans l'habillage laisse voir une cavité. Au fond, un matelas isolant matelassé et deux cadres verticaux. Un faisceau orange traverse la cavité, tenu par un collier sur chaque cadre et portant une étiquette de repère. Au centre, une ferrure métallique porte un équipement ; un connecteur verrouillé y arrive par une dérivation. Trois des quatre vis de la ferrure portent un trait de vernis témoin ; le quatrième trou, en bas à droite, est vide. Une seconde dérivation passe sous le bord de la ferrure, coincée entre elle et la structure, et se termine par un connecteur en attente protégé par un capuchon. Sur le seuil bas de la cavité traînent un embout de vissage, une chute de collier coupé et une lingette.</desc>
