<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Nettoyer : souffler déplace, aspirer retire</title>
  <desc id="d">Schéma de principe en deux scènes vues en coupe, séparées par un trait pointillé. Chaque scène montre un plancher avec un interstice entre deux panneaux et, dessous, une cavité sombre où passe un faisceau. À gauche, marquée d'une croix rouge : une soufflette envoie un jet d'air sur des copeaux ; un copeau est projeté en l'air, un autre passe par l'interstice et finit posé sur le faisceau, sous le plancher, là où on ne le voit plus. À droite, marquée d'une coche verte : une buse d'aspiration posée près de l'interstice avale les copeaux, qui se retrouvent dans la cuve transparente de l'aspirateur, où on peut les voir et les compter ; la cavité reste propre.</desc>
