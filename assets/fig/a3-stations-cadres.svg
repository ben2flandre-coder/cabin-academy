  <path class="sk" d="M745 192 L850 96 L905 96 L940 238 L880 220 Z"/>
  <path class="sk" d="M110 286 C114 240 160 190 250 190 L740 190 C820 190 890 214 950 236 L950 252 C890 290 820 350 740 350 L250 350 C170 350 116 330 110 286 Z"/>
