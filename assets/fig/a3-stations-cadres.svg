<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Repérer une position le long du fuselage : cadres numérotés et stations</title>
  <desc id="d">Fuselage d'avion vu de côté, avant à gauche. Neuf cadres sont dessinés comme des traits verticaux régulièrement espacés et numérotés de l'avant vers l'arrière ; un cadre sur deux porte son numéro : 2, 4, 6, 8. L'espace entre les cadres 3 et 4 est mis en évidence : c'est un intervalle entre deux cadres. Un équipement est posé sur le plancher entre les cadres 7 et 8. En avant du nez, un trait pointillé vertical marqué 0 représente le plan d'origine. Sous l'avion, une règle graduée part de ce plan : graduations fictives 0, 10, 20, 30. Une flèche bleue va du plan d'origine jusqu'au cadre 7 : cette distance mesurée le long de l'axe X est la station de ce cadre.</desc>
