<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Baliser une zone : les éléments de principe</title>
  <desc id="d">Schéma de principe, vue de face. À gauche, un tableau de zone sur pieds, quadrillé comme un planning, avec quelques cases colorées. À côté, une flèche descendante marque le point d'entrée de la zone. À droite, trois potelets reliés par un ruban rayé rouge et blanc ferment une zone réservée. Un panneau accroché au ruban porte un triangle d'avertissement et le mot ESSAI. Derrière le ruban, un banc d'essai marqué d'un éclair ; une étiquette rouge de consigne barrée d'une croix y est accrochée. Au sol, devant le tout, une bande fléchée matérialise le cheminement de circulation.</desc>
  <rect class="bgp" width="1000" height="640"/>
  <path class="ln2" d="M20 520 H980"/>
  <g data-part="cheminement">
    <rect class="in" x="30" y="548" width="940" height="72" rx="10"/>
    <path class="dim" d="M80 584 L250 584"/><path class="dimf" d="M258 584 L230.7 594.5 L230.7 573.5 Z"/>
    <path class="dim" d="M400 584 L570 584"/><path class="dimf" d="M578 584 L550.7 594.5 L550.7 573.5 Z"/>
    <path class="dim" d="M720 584 L890 584"/><path class="dimf" d="M898 584 L870.7 594.5 L870.7 573.5 Z"/>
  </g>
  <g data-part="zone">
    <rect class="eq2" x="700" y="350" width="190" height="170" rx="10"/>
    <path class="syf" d="M840 366 l-40 64 h26 l-14 56 l52 -76 h-28 l16 -44 Z"/>
  </g>
  <g data-part="consigne">
    <path class="ln" d="M748 350 v24"/>
    <path class="badf" d="M714 374 h68 v84 l-34 26 l-34 -26 Z"/>
    <circle class="wh" cx="748" cy="462" r="7"/>
    <path class="ln2" d="M730 394 L766 430 M766 394 L730 430"/>
  </g>
  <g data-part="potelets">
    <rect class="mt" x="371" y="250" width="18" height="254"/><path class="dk" d="M340 520 l12 -18 h56 l12 18 Z"/><circle class="dk" cx="380" cy="246" r="14"/>
    <rect class="mt" x="631" y="250" width="18" height="254"/><path class="dk" d="M600 520 l12 -18 h56 l12 18 Z"/><circle class="dk" cx="640" cy="246" r="14"/>
    <rect class="mt" x="891" y="250" width="18" height="254"/><path class="dk" d="M860 520 l12 -18 h56 l12 18 Z"/><circle class="dk" cx="900" cy="246" r="14"/>
  </g>
  <g data-part="ruban">
    <rect class="none" pointer-events="all" x="394" y="256" width="492" height="62" rx="10"/>
    <path class="badf" d="M394 270 h41 v34 h-41 Z"/>
    <path class="wh" d="M435 270 h41 v34 h-41 Z"/>
    <path class="badf" d="M476 270 h41 v34 h-41 Z"/>
    <path class="wh" d="M517 270 h41 v34 h-41 Z"/>
    <path class="badf" d="M558 270 h41 v34 h-41 Z"/>
    <path class="wh" d="M599 270 h41 v34 h-41 Z"/>
    <path class="badf" d="M640 270 h41 v34 h-41 Z"/>
    <path class="wh" d="M681 270 h41 v34 h-41 Z"/>
    <path class="badf" d="M722 270 h41 v34 h-41 Z"/>
    <path class="wh" d="M763 270 h41 v34 h-41 Z"/>
    <path class="badf" d="M804 270 h41 v34 h-41 Z"/>
    <path class="wh" d="M845 270 h41 v34 h-41 Z"/>
  </g>
  <g data-part="panneau">
    <rect class="wh" x="410" y="304" width="210" height="170" rx="10"/>
    <path class="syf" d="M515 318 l48 82 h-96 Z"/>
    <path class="ln2" d="M515 346 v26 M515 386 v2"/>
  </g>
  <text class="tb tc" x="515" y="458" pointer-events="none">ESSAI</text>
  <g data-part="tableau">
    <path class="ln2" d="M60 280 L44 520 M200 280 L216 520"/>
    <rect class="wh" x="30" y="40" width="200" height="244" rx="10"/>
    <rect class="in" x="30" y="40" width="200" height="64" rx="10"/>
    <path class="thin" d="M30 164 h200 M30 224 h200 M96 104 v180 M162 104 v180"/>
    <rect class="eq" x="102" y="110" width="54" height="48"/>
    <rect class="eq2" x="168" y="170" width="56" height="48"/>
    <rect class="eq" x="36" y="230" width="54" height="48"/>
  </g>
  <text class="ts tc" x="130" y="86" pointer-events="none">ZONE</text>
  <g data-part="acces">
    <rect class="none" pointer-events="all" x="240" y="300" width="130" height="220" rx="10"/>
    <path class="dim" d="M306 330 L306 500"/><path class="dimf" d="M306 508 L293.5 477.2 L318.5 477.2 Z"/>
  </g>
  <g class="badges">
