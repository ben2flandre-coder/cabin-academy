<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Manipuler un connecteur : trois gestes justes, deux erreurs, une précaution</title>
  <desc id="d">Six vignettes. 1, geste juste : deux doigts saisissent la bague et le corps du connecteur, une flèche bleue tire dans l'axe. 2, erreur : les doigts tirent sur les fils en arrière du connecteur, un fil est sorti de l'arrière, marqué en rouge. 3, geste juste : embase et fiche vues de face, leurs détrompeurs sont tous deux en haut, reliés par un trait bleu. 4, erreur : la fiche est tournée, son détrompeur n'est plus en face de la rainure de l'embase, un trait rouge montre l'écart et une étoile rouge marque les broches forcées. 5, geste juste : un connecteur débranché est fermé par son bouchon, retenu par un cordon. 6, précaution : un avant-bras porte un bracelet relié par un cordon spiralé à un point de masse de la structure, la main s'approche d'un équipement électronique.</desc>
