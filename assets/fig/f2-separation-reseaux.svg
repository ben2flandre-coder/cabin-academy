<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Séparer les réseaux : les fils au-dessus des fluides</title>
  <desc id="d">Schéma de principe en deux vues du même cheminement. À gauche, coupe : un cadre porte trois bras superposés ; en haut un gros faisceau de puissance, au milieu un faisceau de signaux plus fin, en bas un tuyau de fluide. Une double flèche marque l'écart entre les deux faisceaux. À droite, vue de côté : les deux faisceaux courent au-dessus du tuyau ; un raccord du tuyau laisse tomber des gouttes, qui tombent vers le bas sans toucher les fils.</desc>
