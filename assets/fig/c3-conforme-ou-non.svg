    <g class="badge" data-badge="ecart" transform="translate(904 383)"><circle class="bd" r="26"/><text class="bn">6</text></g>
    <g class="badge" data-badge="arreter" transform="translate(904 463)"><circle class="bd" r="26"/><text class="bn">7</text></g>
    <g class="badge" data-badge="identifier" transform="translate(904 543)"><circle class="bd" r="26"/><text class="bn">8</text></g>
    <g class="badge" data-badge="signaler" transform="translate(904 623)"><circle class="bd" r="26"/><text class="bn">9</text></g>
    <g class="badge" data-badge="decision" transform="translate(404 623)"><circle class="bd" r="26"/><text class="bn">10</text></g>
    <g class="badge" data-badge="tracer" transform="translate(904 717)"><circle class="bd" r="26"/><text class="bn">11</text></g>
  </g>
</svg>
