<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Quatre familles de raccords et d'obturateurs</title>
  <desc id="d">Planche en quatre cases, schémas de principe. En haut à gauche, raccord vissé : deux tubes rigides, un corps de raccord fileté au centre et un écrou de chaque côté. En haut à droite, raccord rapide : un coupleur muni d'une bague coulissante, et l'embout mâle qui vient s'y enclencher. En bas à gauche, deux conduits rigides réunis par un manchon souple serré par deux colliers à vis. En bas à droite, obturateurs : un capuchon qui coiffe l'extrémité d'un tube, et un bouchon enfoncé dans l'orifice d'un équipement.</desc>
