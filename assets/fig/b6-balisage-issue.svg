<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Une issue de secours et son balisage</title>
  <desc id="d">Schéma de principe d'une porte de cabine vue de l'intérieur. Au-dessus de la porte, un panneau lumineux marqué EXIT ; au plafond, un éclairage de secours. Sur la porte : un hublot, la poignée de commande d'ouverture, une étiquette d'utilisation avec une flèche, et en partie basse le carter qui renferme le toboggan d'évacuation. Au sol, le balisage lumineux longe le couloir et un repère bas signale l'issue ; devant la porte, une zone doit rester dégagée.</desc>
