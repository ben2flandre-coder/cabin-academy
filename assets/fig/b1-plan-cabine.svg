<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" class="fig" role="img" aria-labelledby="t d">
  <title id="t">La cabine vue de dessus : où se trouvent les meubles, les sièges et les issues</title>
  <desc id="d">Schéma de principe d'une cabine monocouloir générique vue de dessus, avant à gauche : le côté droit (RH) est en haut, le côté gauche (LH) en bas. À l'avant, derrière la cloison du poste de pilotage : un galley côté droit et un bloc toilettes côté gauche ; puis un passage transversal avec une porte de chaque côté et un siège équipage replié contre le meuble. Une cloison de séparation ferme le passage côté cabine. Viennent ensuite cinq rangées de trois sièges de chaque côté de l'allée centrale, une issue sur l'aile de chaque côté, puis cinq autres rangées. À l'arrière : un second passage transversal avec deux portes et un siège équipage, puis un galley contre le fond de la cabine.</desc>
