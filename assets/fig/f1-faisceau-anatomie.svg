<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Anatomie d’un faisceau électrique</title>
  <desc id="d">Schéma de principe d'un faisceau vu de côté. À gauche, un connecteur à bague moletée prolongé par un raccord arrière conique qui serre le câble. Le tronc du faisceau est protégé par une gaine sombre, porte une étiquette de repère et deux frettes qui serrent les fils ensemble ; une dérivation part vers le bas et se termine par un petit connecteur. À droite, la gaine est coupée pour montrer la tresse métallique de blindage, puis les fils orange qui en sortent, dont deux torsadés en paire. En bas, un fil agrandi : l'âme métallique faite de brins, l'isolant clair, et le repère EX-W214-22 imprimé sur l'isolant.</desc>
