<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les réseaux d'une cabine, sur une coupe</title>
  <desc id="d">Schéma de principe, coupe transversale d'un fuselage vue depuis l'arrière vers l'avant. Sous le plancher, la soute ; au-dessus, deux blocs de trois sièges, deux rangements en hauteur et un plafond. Dans la voûte, au-dessus du plafond : un conduit d'air conditionné, des faisceaux électriques tenus par des colliers, et une tresse de métallisation reliant un cadre à un support. Derrière l'habillage latéral, des colonnes d'air ; des flèches montrent l'air soufflé en haut et repris près du plancher. Sous chaque rangement, le bloc de services contient un boîtier d'oxygène et une buse d'air individuel. Sous le plancher, à gauche un tuyau d'eau potable, à droite un tuyau de vidange qui descend jusqu'à un mât de drainage sous le ventre de l'avion.</desc>
