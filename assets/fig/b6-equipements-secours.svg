<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Équipements de secours : formes et emplacements-types</title>
  <desc id="d">Schéma de principe. Au centre, une cabine vue de dessus, avant à gauche : les issues sur les côtés, le balisage lumineux de part et d'autre du couloir et vers les issues, les sièges d'équipage près des portes. Autour, six équipements portatifs sont dessinés en grand et reliés par un trait à un emplacement possible : un extincteur, une bouteille d'oxygène avec son masque, une trousse de premiers secours, un mégaphone, un gilet de sauvetage (sous un siège passager) et une torche (au siège d'équipage).</desc>
