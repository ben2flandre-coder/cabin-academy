<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 692" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Où se trouve l'identification : six cas de principe</title>
  <desc id="d">Schéma de principe en six vignettes. Un : une équerre métallique dont la référence EX-48213-07 est gravée directement dans le métal. Deux : un boîtier d'équipement portant une plaque métallique rivetée aux quatre coins, avec les lignes P/N et S/N. Trois : un panneau d'habillage à hublot dont la référence EX-52107-02 est imprimée à l'encre dans un cadre. Quatre : un faisceau de câbles portant une petite étiquette de repère EX-W12. Cinq : un sachet transparent refermable contenant quatre vis, dont l'étiquette porte P/N et LOT ; les vis elles-mêmes n'ont pas de référence lisible. Six : une pièce sans marquage à laquelle est attachée par un lien une étiquette volante marquée ATTENTE.</desc>
  <rect class="bgp" width="1000" height="692"/>
  <g data-part="gravure">
    <rect class="in" x="24" y="20" width="304" height="316" rx="16"/>
    <path class="mt" d="M46 116 h260 v150 h-260 Z"/>
    <circle class="wh" cx="80" cy="148" r="14"/><circle class="wh" cx="272" cy="148" r="14"/>
    <rect class="dash" x="58" y="184" width="236" height="66" rx="6"/>
  </g>
  <text class="ts tc" x="176" y="230" pointer-events="none">EX-48213-07</text>
  <g data-part="plaque">
    <rect class="in" x="348" y="20" width="304" height="316" rx="16"/>
    <rect class="eq" x="374" y="104" width="252" height="208" rx="14"/>
    <rect class="dk" x="408" y="84" width="60" height="22" rx="4"/><rect class="dk" x="532" y="84" width="60" height="22" rx="4"/>
    <rect class="mt" x="394" y="140" width="212" height="140" rx="6"/>
    <circle class="dk" cx="408" cy="154" r="6"/><circle class="dk" cx="592" cy="154" r="6"/><circle class="dk" cx="408" cy="266" r="6"/><circle class="dk" cx="592" cy="266" r="6"/>
    <path class="ln2" d="M500 188 h70 M500 238 h70"/>
  </g>
  <text class="ts" x="424" y="201" pointer-events="none">P/N</text>
  <text class="ts" x="424" y="251" pointer-events="none">S/N</text>
  <g data-part="encre">
    <rect class="in" x="672" y="20" width="304" height="316" rx="16"/>
    <rect class="wh" x="694" y="104" width="260" height="214" rx="26"/>
    <rect class="gl" x="780" y="220" width="88" height="78" rx="34"/>
    <rect class="ln" x="702" y="132" width="244" height="64" rx="4"/>
  </g>
  <text class="ts tc ta" x="824" y="177" pointer-events="none">EX-52107-02</text>
  <g data-part="manchon">
    <rect class="in" x="24" y="356" width="304" height="316" rx="16"/>
    <path class="sy" d="M50 476 C114 452 234 506 302 474"/>
    <path class="sy" d="M50 494 C114 470 234 524 302 492"/>
    <rect class="dk" x="108" y="454" width="20" height="50" rx="4"/><rect class="dk" x="246" y="470" width="20" height="50" rx="4"/>
    <rect class="wh" x="84" y="532" width="184" height="76" rx="6"/>
    <path class="ln" d="M176 498 v34"/>
  </g>
  <text class="ts tc" x="176" y="584" pointer-events="none">EX-W12</text>
  <g data-part="sachet">
    <rect class="in" x="348" y="356" width="304" height="316" rx="16"/>
    <path class="gl" d="M388 434 h224 v214 h-224 Z"/>
    <path class="ln2" d="M388 456 h224"/>
    <rect class="wh" x="406" y="472" width="188" height="70" rx="4"/>
    <g transform="translate(444 578) rotate(20)"><rect class="mt2" x="-16" y="-8" width="14" height="16" rx="3"/><rect class="mt" x="-2" y="-4" width="40" height="8"/></g>
    <g transform="translate(524 570) rotate(-35)"><rect class="mt2" x="-16" y="-8" width="14" height="16" rx="3"/><rect class="mt" x="-2" y="-4" width="40" height="8"/></g>
    <g transform="translate(470 618) rotate(-10)"><rect class="mt2" x="-16" y="-8" width="14" height="16" rx="3"/><rect class="mt" x="-2" y="-4" width="40" height="8"/></g>
    <g transform="translate(552 618) rotate(40)"><rect class="mt2" x="-16" y="-8" width="14" height="16" rx="3"/><rect class="mt" x="-2" y="-4" width="40" height="8"/></g>
  </g>
  <text class="ts tc" x="500" y="520" pointer-events="none">P/N · LOT</text>
  <g data-part="volante">
    <rect class="in" x="672" y="356" width="304" height="316" rx="16"/>
    <path class="mt" d="M822 426 h130 v70 h-130 Z"/>
    <circle class="wh" cx="848" cy="460" r="13"/>
    <path class="ln" d="M848 460 C822 506 768 506 746 554"/>
