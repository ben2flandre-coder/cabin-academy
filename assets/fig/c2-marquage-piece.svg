  </g>
  <text class="ts tc tr" x="850" y="605" pointer-events="none">ATTENTE</text>
  <g class="badges">
    <g class="badge" data-badge="gravure" transform="translate(64 64)"><circle class="bd" r="26"/><text class="bn">1</text></g>
    <g class="badge" data-badge="plaque" transform="translate(388 64)"><circle class="bd" r="26"/><text class="bn">2</text></g>
    <g class="badge" data-badge="encre" transform="translate(712 64)"><circle class="bd" r="26"/><text class="bn">3</text></g>
    <g class="badge" data-badge="manchon" transform="translate(64 400)"><circle class="bd" r="26"/><text class="bn">4</text></g>
    <g class="badge" data-badge="sachet" transform="translate(388 400)"><circle class="bd" r="26"/><text class="bn">5</text></g>
    <g class="badge" data-badge="volante" transform="translate(712 400)"><circle class="bd" r="26"/><text class="bn">6</text></g>
  </g>
</svg>
