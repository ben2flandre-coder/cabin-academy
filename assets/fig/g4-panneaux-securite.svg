<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six panneaux de sécurité : la forme et la couleur donnent le sens</title>
  <desc id="d">Six panneaux sur deux rangées. En haut : un panneau rond à bord rouge barré d'une diagonale rouge, avec une cigarette noire sur fond blanc (interdiction) ; un panneau rond bleu avec des lunettes blanches (obligation) ; un triangle pointe en haut à fond jaune, ici rendu ambré, bord noir et point d'exclamation noir (avertissement de danger). En bas : un carré vert avec une croix blanche (premiers secours) ; un rectangle vert avec une personne blanche qui court vers une porte (issue de secours) ; un carré rouge avec un extincteur blanc et une flamme (matériel de lutte contre l'incendie).</desc>
  <rect class="bgp" width="1000" height="610"/>
  <g data-part="interdiction">
    <circle class="badf" cx="175" cy="160" r="112"/>
    <circle class="bgp" cx="175" cy="160" r="88"/>
    <rect class="dk" x="113" y="162" width="96" height="24" rx="3"/>
    <rect class="wh" x="209" y="162" width="26" height="24" rx="3"/>
    <path class="ln2" d="M223 152 q-14 -16 0 -30 q12 -14 -2 -28"/>
    <path class="badf" d="M100.5 102.5 L232.5 234.5 L249.5 217.5 L117.5 85.5 Z"/>
  </g>
  <g data-part="obligation">
    <circle class="dimf" cx="500" cy="160" r="112"/>
    <circle class="ln" cx="500" cy="160" r="112"/>
