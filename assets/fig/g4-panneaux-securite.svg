    <ellipse class="bgp" cx="542" cy="160" rx="44" ry="36"/>
    <ellipse class="dimf" cx="458" cy="160" rx="29" ry="22"/>
    <ellipse class="dimf" cx="542" cy="160" rx="29" ry="22"/>
  </g>
  <g data-part="avertissement">
