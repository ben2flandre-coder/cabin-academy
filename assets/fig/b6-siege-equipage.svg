    <rect class="mt2" x="462" y="318" width="46" height="40" rx="8"/>
    <path class="ln2" d="M485 372 Q470 410 492 440 Q508 462 490 490"/>
  </g>
  <rect class="in" x="900" y="70" width="40" height="598"/>
