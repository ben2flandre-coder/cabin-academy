<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Siège d'équipage (strapontin)</title>
  <desc id="d">Schéma de principe d'un siège d'équipage fixé contre une cloison. À gauche, vue de face : l'appui-tête, le dossier, l'assise abaissée, le harnais dont les deux sangles d'épaules et les deux sangles de ceinture se rejoignent dans une boucle centrale, un combiné d'interphone sur la cloison et un rangement sous l'assise. À droite, vue de côté : le siège tient sur la cloison par ses fixations ; l'assise est dessinée relevée, sa position abaissée est indiquée en pointillé avec une flèche montrant qu'elle se relève seule.</desc>
  <rect class="bgp" width="1000" height="720"/>
  <text class="ts tc" x="300" y="50">Vue de face</text>
  <text class="ts tc" x="790" y="50">Vue de côté</text>
  <line class="dash" x1="590" y1="70" x2="590" y2="700"/>
  <rect class="fl" x="30" y="668" width="940" height="34"/>
  <rect class="in" x="110" y="70" width="440" height="598"/>
