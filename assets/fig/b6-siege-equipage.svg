    <circle class="dk" cx="887" cy="494" r="8"/>
  </g>
  <g data-part="appui-tete">
    <rect class="eq2" x="826" y="90" width="46" height="86" rx="14"/>
  </g>
  <g data-part="dossier">
    <rect class="eq" x="838" y="186" width="34" height="290" rx="10"/>
  </g>
  <g data-part="rangement">
    <rect class="wh" x="800" y="540" width="72" height="110" rx="6"/>
