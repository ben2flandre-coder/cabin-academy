<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Au-dessus du plafond : la cavité et ses réseaux, en coupe</title>
  <desc id="d">Schéma de principe : coupe transversale du haut de la cabine, vue vers l'avant. De l'extérieur vers l'intérieur : la peau du fuselage, un cadre, un matelas isolant. Dessous, la cavité de plafond contient un gros conduit d'air au centre, deux faisceaux électriques tenus par des colliers sur leurs supports, et une fine tuyauterie d'oxygène. La cavité est fermée vers le bas par le panneau de plafond, suspendu au cadre par des supports ; de chaque côté, un bac à bagages avec son PSU dessous ; à la jonction du plafond et des bacs, un bandeau d'éclairage.</desc>
