<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" class="fig" role="img" aria-labelledby="t d">
<title id="t">Calibre « entre / n'entre pas » : trois alésages essayés</title>
<desc id="d">En haut, un calibre tampon à deux bouts : à gauche un cylindre vert, long et un peu plus fin, le côté « entre » ; au milieu un manche moleté ; à droite un cylindre rouge, court et un peu plus gros, le côté « n'entre pas ». En bas, trois plaques vues en coupe, chacune percée de deux trous identiques sur lesquels on présente les deux bouts. Premier cas : aucun des deux bouts n'entre. Deuxième cas : le bout vert entre, le bout rouge reste posé à l'entrée. Troisième cas : les deux bouts entrent.</desc>
<rect class="bgp" width="1000" height="620"/>
<text class="ts tc" x="270" y="60">ENTRE</text>
<text class="ts tc" x="716" y="60">N'ENTRE PAS</text>
