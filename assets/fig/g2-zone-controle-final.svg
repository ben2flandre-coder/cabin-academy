<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Contrôle final de zone : pied de paroi et plancher, vus de dessus</title>
  <desc id="d">Schéma de principe d'une zone de cabine vue de dessus avant fermeture. En haut, le bas de paroi avec une grille. Le plancher porte deux rails de siège ; une ferrure de siège est verrouillée sur le rail du bas. Au centre, un panneau de plancher est déposé : la cavité laisse voir une traverse, un faisceau fixé par deux colliers et son étiquette d'identification. Le panneau voisin est tenu par quatre vis en place. Cinq objets n'ont rien à faire là : une vis couchée dans le rail du haut, une chute de collier et un chiffon dans la cavité, un embout de vissage et un sachet vide sur le plancher.</desc>
