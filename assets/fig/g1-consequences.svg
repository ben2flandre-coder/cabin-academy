<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Quatre conséquences d'un objet oublié</title>
  <desc id="d">Planche de quatre schémas de principe. Blocage : un écrou est coincé entre un câble de commande et la poulie sur laquelle il s'enroule. Usure lente : une vis est prise entre un faisceau électrique et une pièce de structure ; des traits de vibration encadrent la scène et une marque rouge signale l'isolant entamé. Blessure : la queue coupée en biseau d'un serre-câble dépasse d'un faisceau et un doigt s'y blesse, une goutte rouge tombe. Immobilisation : une horloge, et un panneau de plancher déposé, appuyé contre le bord de l'ouverture qu'une lampe éclaire.</desc>
  <rect class="bgp" width="1000" height="730"/>
  <path class="thin" d="M500 24 L500 706"/>
  <path class="thin" d="M24 365 L976 365"/>
