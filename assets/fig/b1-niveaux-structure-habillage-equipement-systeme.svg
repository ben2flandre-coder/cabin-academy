<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les quatre niveaux de la cabine : structure, habillage, équipement, système</title>
  <desc id="d">La même coupe de cabine (vue de l'arrière vers l'avant) est dessinée quatre fois ; chaque vignette ne garde qu'une famille d'objets. Vignette 1, structure : peau, cadre, vitres extérieures des hublots, traverse de plancher, rails de sièges et panneaux de plancher. Vignette 2, habillage : matelas isolant, panneaux latéraux avec la vitre intérieure, panneaux dado et panneau de plafond. Vignette 3, équipement : sièges, bagageries et blocs de service passagers. Vignette 4, système : conduits d'air, faisceaux électriques dans leurs goulottes et rampes d'éclairage.</desc>
