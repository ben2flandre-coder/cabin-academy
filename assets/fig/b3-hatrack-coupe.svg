<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Bagagerie (hatrack) : coupe d’un bac et deux familles de bacs</title>
  <desc id="d">Schéma de principe. À gauche, coupe transversale d'un bac à bagages du côté gauche de la cabine, vue vers l'avant : le caisson du bac est suspendu au cadre du fuselage par des ferrures et une bielle ; sa porte, articulée en haut par une charnière, est retenue par un vérin-amortisseur et fermée en bas par un verrou ; une étiquette de charge maximale est collée à l'intérieur ; le PSU est fixé sous le bac ; le panneau de plafond rejoint le haut du bac et le panneau d'habillage latéral part sous le bac. À droite, deux pictogrammes : le bac fixe, dont seule la porte se lève, et le bac basculant, dont toute la cuve descend en pivotant.</desc>
