<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six prises d'outil : deux correctes, quatre fautives</title>
  <desc id="d">Six vignettes. En haut, trois clés à fourche vues de dessus sur un écrou six pans. Première : la fourche a la bonne taille et l'écrou est au fond, les deux mâchoires portent sur toute la longueur de deux pans opposés. Deuxième : la fourche est trop grande, l'écrou a tourné dans le jeu et seules deux arêtes touchent les mâchoires. Troisième : la fourche a la bonne taille mais n'est engagée que du bout, les mâchoires ne tiennent qu'une petite partie des pans. En bas, trois embouts de vissage dans la tête d'une vis, vus en coupe. Quatrième : l'embout remplit l'empreinte et il est dans l'axe de la vis. Cinquième : l'embout est trop petit, il touche le fond mais laisse un vide sur les côtés. Sixième : l'embout a la bonne taille mais il est incliné, il ne porte que d'un côté.</desc>
