<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" class="fig" role="img" aria-labelledby="t d">
  <title id="t">La paroi de la cabine, habillée puis ouverte</title>
  <desc id="d">Schéma de principe : la paroi droite d'une cabine vue depuis l'allée, avant de l'avion à gauche. Sur la partie gauche de l'image, la paroi est habillée : un grand panneau clair percé de deux hublots, un panneau bas à grille au ras du plancher, et devant, un siège vu de profil. Sur la partie droite, les panneaux ont été retirés : on voit la peau au fond ; devant elle, des lisses horizontales ; devant les lisses, trois cadres verticaux régulièrement espacés ; entre deux cadres, à hauteur des yeux d'un passager assis, une fenêtre entourée d'un encadrement épais. En haut, un faisceau de câbles orange court d'un cadre à l'autre, tenu sur chaque cadre par un support et un collier. En bas à droite, des matelas isolants matelassés remplissent encore deux intervalles entre cadres. Le plancher court en bas sur toute la largeur.</desc>
