<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Panneau de plafond ouvert : ce qu’on voit, et ce qui ne devrait pas y être</title>
  <desc id="d">Schéma de principe : coupe transversale du haut de la cabine, vue vers l'avant, avec un panneau de plafond ouvert. Le panneau pivote autour d'une charnière placée du côté du bac gauche et pend dans l'allée ; un câble de retenue le relie encore à un support de la structure ; son verrou est à l'extrémité libre, et la gâche qui le reçoit est restée en haut, côté bac droit. Par l'ouverture on voit le conduit d'air au centre, un faisceau électrique tenu par son collier à gauche et les supports qui descendent du cadre. Quatre anomalies sont à trouver avant de refermer : un chiffon oublié sur le bac gauche, une clé oubliée sur le bac droit, un morceau de matelas isolant décroché qui pend, et à droite un faisceau sorti de son collier, descendu dans le passage du panneau.</desc>
