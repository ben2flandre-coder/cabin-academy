<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Une zone de cabine partagée par quatre métiers</title>
  <desc id="d">Schéma de principe, vue de dessus d'une portion de cabine en cours d'aménagement, avant à gauche. Une allée de circulation faite de dalles de protection traverse la zone dans sa longueur. En haut à gauche, un chariot de logistique chargé de cartons est garé juste devant une porte. Le long de la paroi, une servante d'outillage fermée est rangée hors du passage. En haut à droite, une zone d'essai entourée d'un balisage à quatre potelets contient un banc d'essai, un symbole d'éclair et un opérateur. Un câble orange part de ce banc, sort du balisage et traverse l'allée jusqu'à un boîtier posé au sol. Une dalle de l'allée est déplacée de travers et laisse le plancher à nu. En bas, une personne ponce et un nuage de poussière se répand autour d'elle, jusqu'aux rails et vers un élément voisin couvert d'une housse. En bas à gauche, une seconde porte est dégagée.</desc>
