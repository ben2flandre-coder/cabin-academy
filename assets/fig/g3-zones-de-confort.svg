<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Où travaillent tes mains : zones de confort et zones contraignantes</title>
  <desc id="d">Schéma de principe. À gauche, une personne debout de profil, l'avant-bras à l'horizontale. Une jauge verticale découpe la hauteur en cinq tranches : rouge au-dessus de la tête, orange entre la tête et les épaules, verte entre les épaules et les hanches, orange entre les hanches et les genoux, rouge sous les genoux. Une barre horizontale au sol montre l'éloignement : verte près du corps, orange à bout de bras. À droite, deux scènes de cabine où un cercle rouge entoure les mains : en haut, une personne bras tendus sous un élément de plafond ; en bas, une personne à genoux, penchée sur un rail de plancher, un tapis sous les genoux.</desc>
