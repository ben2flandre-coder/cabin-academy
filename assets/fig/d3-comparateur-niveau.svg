<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
<title id="t">Comparateur à cadran et niveau à bulle : le principe</title>
<desc id="d">À gauche, un comparateur à cadran tenu par un support à base lourde au-dessus d'une pièce posée sur un marbre, la surface de référence. Sous le cadran rond sort une tige terminée par une touche qui appuie sur la pièce ; la pièce présente une petite marche, et l'aiguille du cadran s'est écartée du zéro : le comparateur montre un écart, pas une dimension. À droite, deux niveaux à bulle. En haut, le niveau est posé sur une surface horizontale : la bulle est centrée entre les deux repères de la fiole. En bas, le niveau est posé sur une surface inclinée : la bulle a quitté les repères et s'est déplacée vers le côté le plus haut.</desc>
