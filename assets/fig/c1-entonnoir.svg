<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Chercher une information : la méthode en entonnoir</title>
  <desc id="d">Entonnoir formé de cinq étages de plus en plus étroits, de haut en bas : cartouche, indice, nomenclature, vues, notes. Une flèche sort par le bas : l'information trouvée et vérifiée.</desc>
  <rect class="bgp" width="1000" height="700"/>
  <g data-part="cartouche">
    <path class="eq" d="M60 60 L940 60 L878 156 L122 156 Z"/>
    <text class="tb tc" x="500" y="122">Cartouche</text>
  </g>
  <g data-part="indice">
    <path class="in" d="M122 164 L878 164 L816 260 L184 260 Z"/>
    <text class="tb tc" x="500" y="226">Indice</text>
  </g>
  <g data-part="nomenclature">
    <path class="eq" d="M184 268 L816 268 L754 364 L246 364 Z"/>
    <text class="tb tc" x="500" y="330">Nomenclature</text>
  </g>
  <g data-part="vue">
    <path class="in" d="M246 372 L754 372 L692 468 L308 468 Z"/>
    <text class="tb tc" x="500" y="434">Vues</text>
  </g>
  <g data-part="notes">
    <path class="eq" d="M308 476 L692 476 L630 572 L370 572 Z"/>
    <text class="tb tc" x="500" y="538">Notes</text>
  </g>
  <g data-part="information">
    <path class="okf" d="M370 580 L630 580 L630 620 L560 620 L500 676 L440 620 L370 620 Z"/>
    <circle class="wh" cx="500" cy="600" r="15"/>
  </g>
  <g class="badges">
    <g class="badge" data-badge="cartouche" transform="translate(138 108)"><circle class="bd" r="26"/><text class="bn">1</text></g>
    <g class="badge" data-badge="indice" transform="translate(200 212)"><circle class="bd" r="26"/><text class="bn">2</text></g>
    <g class="badge" data-badge="nomenclature" transform="translate(262 316)"><circle class="bd" r="26"/><text class="bn">3</text></g>
    <g class="badge" data-badge="vue" transform="translate(324 420)"><circle class="bd" r="26"/><text class="bn">4</text></g>
    <g class="badge" data-badge="notes" transform="translate(386 524)"><circle class="bd" r="26"/><text class="bn">5</text></g>
    <g class="badge" data-badge="information" transform="translate(660 620)"><circle class="bd" r="26"/><text class="bn">6</text></g>
  </g>
</svg>
