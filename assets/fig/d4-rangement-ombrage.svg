<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" class="fig" role="img" aria-labelledby="t d">
<title id="t">Un tiroir d'outils en mousse ombrée, à inventorier</title>
<desc id="d">Tiroir de servante vu de dessus, garni d'une mousse sombre où chaque outil a son empreinte claire découpée à sa forme. Première rangée : un tournevis plat, un tournevis cruciforme, un réglet, chacun dans son empreinte. Deuxième rangée : une clé mixte dans son empreinte ; à côté, une empreinte de clé mixte vide ; puis un cliquet. Troisième rangée : six empreintes rondes de douilles de tailles décroissantes, dont la quatrième est vide ; une pince dans son empreinte. En bas à gauche, posées sur la mousse hors de toute empreinte, une vis et une rondelle. Sous le tiroir, une étiquette : Tiroir EX-T2, 13 emplacements.</desc>
