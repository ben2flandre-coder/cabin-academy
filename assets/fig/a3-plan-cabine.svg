<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Plan de cabine fictif vu de dessus : rangées, lettres, allée, portes</title>
  <desc id="d">Document fictif pédagogique. Tronçon de cabine vu de dessus, avant à gauche : le côté droit de l'avion (RH) est en haut de l'image, le côté gauche (LH) en bas. Cinq rangées de sièges numérotées 1 à 5 de l'avant vers l'arrière ; dans chaque rangée, six sièges repérés par une lettre, de A côté hublot gauche (en bas) à F côté hublot droit (en haut), avec l'allée centrale entre C et D. Le dossier de chaque siège est du côté arrière : les passagers regardent vers l'avant. Quatre portes : avant gauche, avant droite, arrière gauche, arrière droite.</desc>
