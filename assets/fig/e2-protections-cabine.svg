<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Coupe de cabine avec les protections posées</title>
  <desc id="d">Coupe transversale d'une cabine, vue depuis l'arrière vers l'avant, côté gauche à gauche. À gauche, une rangée de trois sièges recouverte d'une housse. À droite, les sièges sont déposés : c'est la zone de travail. Les protections sont dessinées en vert : des plaques sur le plancher du couloir et de la zone de travail, une protection sur le panneau de paroi droit, un cache sur le hublot droit, une protection d'arête sur le bord du coffre à bagages droit, un capuchon sur le connecteur d'un faisceau en attente qui pend du plafond. Dans le couloir, un panneau de balisage signale la zone de travail.</desc>
  <rect class="bgp" width="1000" height="700"/>
  <!-- fuselage -->
  <circle class="sk" cx="500" cy="350" r="322"/>
  <circle class="wh" cx="500" cy="350" r="298"/>
  <!-- plancher -->
  <path class="fl" d="M228 470 L772 470 L762 496 L238 496 Z"/>
  <path class="st" d="M300 496 L316 496 L316 600 L300 590 Z M684 496 L700 496 L700 590 L684 600 Z"/>
  <!-- habillage : parois, plafond -->
  <path class="in" d="M232 468 L250 468 C224 404 218 330 236 262 L220 258 C200 330 206 404 232 468 Z"/>
  <path class="in" d="M768 468 L750 468 C776 404 782 330 764 262 L780 258 C800 330 794 404 768 468 Z"/>
  <rect class="gl" x="178" y="308" width="26" height="64" rx="12"/>
  <rect class="gl" x="796" y="308" width="26" height="64" rx="12"/>
  <path class="in" d="M344 158 Q500 104 656 158 L656 174 Q500 122 344 174 Z"/>
  <!-- coffres à bagages -->
  <path class="eq" d="M222 256 L330 256 Q344 256 344 242 L344 160 Q300 124 262 150 Q224 196 222 256 Z"/>
  <path class="eq" d="M778 256 L670 256 Q656 256 656 242 L656 160 Q700 124 738 150 Q776 196 778 256 Z"/>
  <!-- sièges gauche (bas visible) -->
  <rect class="eq" x="250" y="330" width="64" height="118" rx="10"/><rect class="eq" x="320" y="330" width="64" height="118" rx="10"/><rect class="eq" x="390" y="330" width="64" height="118" rx="10"/>
  <path class="ln2" d="M268 448 L268 470 M436 448 L436 470"/>

  <!-- housse de sièges -->
  <g data-part="housse-siege">
    <path class="okf" d="M240 430 L240 330 Q240 310 262 310 L442 310 Q464 310 464 330 L464 430 Z"/>
    <path class="thin" d="M317 316 L317 430 M387 316 L387 430"/>
  </g>
  <!-- protection de plancher -->
  <g data-part="prot-plancher">
    <rect class="okf" x="470" y="444" width="286" height="26" rx="4"/>
    <path class="thin" d="M566 444 L566 470 M662 444 L662 470"/>
  </g>
  <!-- protection de paroi (partie basse) -->
  <g data-part="prot-paroi">
    <rect class="none" pointer-events="all" x="704" y="386" width="84" height="64"/>
    <path class="okf" d="M736 446 L764 446 C774 430 778 410 778 390 L750 390 C750 410 746 430 736 446 Z"/>
  </g>
  <!-- cache de hublot (côté cabine, sur le panneau) -->
  <g data-part="prot-hublot">
    <rect class="none" pointer-events="all" x="716" y="292" width="80" height="92"/>
    <rect class="okf" x="740" y="296" width="36" height="84" rx="10"/>
  </g>
  <!-- protection d'arête du coffre -->
  <g data-part="prot-aretes">
    <path class="okf" d="M644 268 L644 212 Q644 204 652 204 L668 204 L668 244 L712 244 L712 268 Z"/>
  </g>
  <!-- faisceau en attente + capuchon -->
  <g data-part="capuchon">
    <rect class="none" pointer-events="all" x="528" y="140" width="84" height="170"/>
    <path class="sy" d="M572 140 C566 180 584 200 570 236"/>
    <rect class="mt" x="552" y="232" width="36" height="34" rx="4"/>
    <path class="okf" d="M544 262 L596 262 L596 300 Q596 308 588 308 L552 308 Q544 308 544 300 Z"/>
  </g>
  <!-- balisage -->
  <g data-part="balisage">
    <path class="ln2" d="M508 444 L508 396"/>
    <path class="mt2" d="M488 444 L528 444 L520 432 L496 432 Z"/>
    <rect class="syf" x="470" y="330" width="76" height="70" rx="8"/>
    <text class="tb tc" x="508" y="380">!</text>
  </g>

  <g class="badges">
    <g class="badge" data-badge="prot-plancher" transform="translate(614 500)"><circle class="bd" r="24"/><text class="bn">1</text></g>
    <g class="badge" data-badge="housse-siege" transform="translate(352 370)"><circle class="bd" r="24"/><text class="bn">2</text></g>
    <g class="badge" data-badge="prot-paroi" transform="translate(704 416)"><circle class="bd" r="24"/><text class="bn">3</text></g>
    <g class="badge" data-badge="prot-hublot" transform="translate(706 338)"><circle class="bd" r="24"/><text class="bn">4</text></g>
    <g class="badge" data-badge="prot-aretes" transform="translate(630 300)"><circle class="bd" r="24"/><text class="bn">5</text></g>
    <g class="badge" data-badge="capuchon" transform="translate(520 286)"><circle class="bd" r="24"/><text class="bn">6</text></g>
    <g class="badge" data-badge="balisage" transform="translate(574 366)"><circle class="bd" r="24"/><text class="bn">7</text></g>
  </g>
</svg>
