<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Du débris au dommage : la même rondelle en trois temps</title>
  <desc id="d">Schéma de principe en trois vignettes reliées par des flèches. Première vignette : pendant un montage, une rondelle échappe et reste posée sur le plancher, près d'un interstice. Deuxième vignette : la rondelle glisse dans l'interstice et tombe sous le plancher, vers un faisceau électrique. Troisième vignette : la rondelle est posée en travers de deux bornes électriques qu'elle relie, une étincelle jaillit. Sous les deux premières vignettes, une accolade et la mention Debris, l'objet ; sous la troisième, la mention Damage, le dégât.</desc>
