<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six familles de facteurs de risque de TMS</title>
  <desc id="d">Planche de six vignettes. En haut : une masse surmontée d'une flèche rouge vers le bas, pour les efforts ; six têtes de vis identiques reliées par une flèche qui tourne en boucle, pour la répétition ; une personne bras tendus au-dessus de la tête, un arc rouge à l'épaule, pour les postures contraignantes. En bas : une visseuse entourée d'ondes rouges, pour les vibrations ; une horloge dont la petite plage verte de pause est barrée de rouge, pour le temps de récupération insuffisant ; un planning dont toutes les cases sont pleines avec un triangle d'alerte, pour l'organisation du travail.</desc>
