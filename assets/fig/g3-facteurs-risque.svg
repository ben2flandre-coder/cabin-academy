<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Sept facteurs de risque de TMS</title>
  <desc id="d">Planche de sept vignettes. Rangée du haut : une masse surmontée d'une flèche rouge vers le bas, pour les efforts ; six têtes de vis identiques reliées par une flèche qui tourne en boucle, pour les gestes répétitifs ; une personne bras tendus au-dessus de la tête, un arc rouge à l'épaule, pour les postures contraignantes ; une horloge dont la petite plage verte de pause est barrée de rouge, pour la durée sans récupération. Rangée du bas : une visseuse entourée d'ondes rouges, pour les vibrations ; un thermomètre au niveau bas et un flocon, pour le froid ; une grande vignette avec un planning dont toutes les cases sont pleines, un triangle d'alerte et un chronomètre, pour l'organisation du travail et la pression du temps.</desc>
