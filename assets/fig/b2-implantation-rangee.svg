<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Implantation des rangées de sièges sur les rails, vue de dessus</title>
  <desc id="d">Schéma de principe d'un tronçon de cabine à couloir unique vu de dessus, avant de l'avion à gauche. Quatre rails de siège parallèles courent dans le sens de la longueur, deux de chaque côté de l'allée centrale. Quatre rangées de sièges triples sont posées dessus, trois places de chaque côté de l'allée, soit six sièges de front ; chaque siège triple est ancré sur deux rails par quatre points, deux à l'avant et deux à l'arrière. Entre deux rangées, la portion de rail libre est fermée par un cache-rail. Une flèche montre le pas : la distance entre un point d'un siège et le même point du siège de la rangée suivante. Les parois latérales portent les hublots.</desc>
