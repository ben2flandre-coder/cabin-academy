<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 757" class="fig" role="img" aria-labelledby="t d">
<title id="t">Atlas des protections du produit</title>
<desc id="d">Neuf cases, une protection par case, toujours dessinée en vert. Housse enveloppant un siège dont on devine la silhouette en pointillé. Film de protection collé sur un panneau à hublot, un coin décollé, avec son rouleau. Calage en mousse dont le berceau épouse une pièce ronde. Profilé de mousse en U coiffant l'arête d'un panneau, avec sa coupe. Tapis de sol déroulé sur le plancher, un outil qui tombe dessus. Protection de rail recouvrant un rail de siège dont on voit encore trois ouvertures. Coins de protection aux quatre angles d'un colis. Capuchon sur un connecteur électrique et bouchon sur un tuyau, avec une étiquette rouge. Couverture matelassée drapée sur un meuble.</desc>
