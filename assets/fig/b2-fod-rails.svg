<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Avant de poser les sièges : un tronçon de plancher vu de dessus, avec des objets oubliés</title>
  <desc id="d">Schéma de principe, vue de dessus très agrandie d'un morceau de plancher de cabine avant la pose des sièges. Deux rails de siège parallèles traversent l'image ; leur gorge montre l'alternance d'ouvertures rondes et de parties étroites. Entre les rails et autour, des panneaux de plancher tenus par des vis à tête affleurante, alignées le long des rails. Une portion du rail du bas est déjà fermée par un cache-rail ; une ferrure de pied de siège est verrouillée sur le rail du haut. Six objets n'ont rien à faire là : une vis couchée dans la gorge du rail du haut, un embout de vissage dans la gorge du rail du bas, une rondelle et un morceau d'adhésif froissé sur le panneau, une chute de collier de câblage et des copeaux de métal.</desc>
