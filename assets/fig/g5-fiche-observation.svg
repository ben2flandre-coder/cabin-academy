    <path class="ln" d="M184 664 q16 -30 30 -6 q10 16 22 -10 q10 -18 22 10 q8 14 40 2"/>
  </g>
  <g data-part="suite">
    <rect class="wh" x="508" y="590" width="442" height="94" rx="8"/>
    <rect class="dash" x="516" y="598" width="426" height="78" rx="6"/>
    <circle class="okf" cx="566" cy="637" r="27"/>
