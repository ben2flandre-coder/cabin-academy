<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 757" class="fig" role="img" aria-labelledby="t d">
<title id="t">Protections individuelles (EPI) et collectives (EPC)</title>
<desc id="d">Douze cases. Les huit premières, sur fond clair, montrent des équipements de protection individuelle, portés par une seule personne : casquette anti-heurt avec sa coque interne, lunettes de protection à coques latérales, gant, chaussure de sécurité à embout renforcé, casque antibruit à deux coquilles, bouchons d'oreille reliés par un cordon, genouillère à sangles, masque antipoussière à élastiques. Les quatre dernières, sur fond plus soutenu, montrent des protections collectives, installées sur le lieu de travail : garde-corps d'une plateforme avec lisse, sous-lisse et plinthe, balisage par potelets et chaîne avec panneau, aspiration des poussières à la source par un tuyau relié à un aspirateur, mousse de protection posée sur un obstacle à hauteur de tête.</desc>
