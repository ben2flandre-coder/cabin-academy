<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Atlas de la visserie aéronautique générale</title>
  <desc id="d">Planche de douze fixations dessinées en silhouette. Première rangée : vis à tête hexagonale avec fût lisse puis partie filetée ; vis à tête fraisée conique avec sa vue de dessus à empreinte en croix ; vis à tête cylindrique bombée avec sa vue de dessus à empreinte six pans creux ; écrou hexagonal vu de dessus et de côté. Deuxième rangée : écrou à créneaux avec ses fentes ; écrou autofreiné avec sa bague de freinage colorée ; écrou prisonnier sur plaquette à deux trous de rivets ; rondelle plate. Troisième rangée : rivet plein posé dans deux tôles, tête bombée d'un côté et tête écrasée de l'autre ; rivet aveugle avec sa tige et son bulbe côté caché ; insert fileté noyé dans un panneau sandwich ; fixation quart de tour avec sa goupille transversale.</desc>
