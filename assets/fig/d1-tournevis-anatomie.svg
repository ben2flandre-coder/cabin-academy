<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Anatomie d'un tournevis et profils de pointes</title>
  <desc id="d">En haut, un tournevis vu de côté avec ses trois parties : le manche à gauche, la tige ronde au milieu, la pointe à droite. En bas, cinq pointes agrandies, chacune dessinée de côté puis en bout : pointe plate en forme de spatule, pointe Phillips effilée aux flancs en pente, pointe Pozidriv plus trapue aux ailes droites avec de petites nervures entre les ailes, pointe six lobes de type Torx droite et à bout plat, pointe six pans droite à section hexagonale.</desc>
