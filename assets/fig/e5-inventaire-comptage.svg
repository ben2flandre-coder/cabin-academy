<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Inventaire : compter avant, compter après</title>
  <desc id="d">À gauche, un plateau d'outils en mousse sombre à empreintes : un tournevis, un cliquet, une clé plate, trois douilles et trois embouts sont à leur place ; une quatrième empreinte de douille est vide et laisse voir le fond de couleur vive. À droite, une carte de comptage indique Avant : 10 et, en rouge, Après : 9. En dessous, une boîte de lingettes pour les consommables et un bac à chutes. En bas, un sachet transparent contient trois vis déposées, relié à une étiquette d'identification.</desc>
