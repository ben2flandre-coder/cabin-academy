<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Cinq outils dynamométriques à main</title>
  <desc id="d">Cinq outils dessinés l'un sous l'autre, poignée à gauche. Premier : clé à déclenchement, poignée avec bague graduée, corps tubulaire, tête à cliquet. Deuxième : clé à cadran, avec un cadran rond à aiguille au milieu du corps et une seconde aiguille témoin. Troisième : clé électronique, avec un boîtier portant un écran, des boutons et des voyants. Quatrième : clé à lame flexible, avec une lame qui relie la poignée à la tête, une fine tige indicatrice partant de la tête et une petite plaque graduée près de la poignée. Cinquième : tournevis dynamométrique, gros manche, bague graduée avec une fenêtre de lecture, tige et embout.</desc>
