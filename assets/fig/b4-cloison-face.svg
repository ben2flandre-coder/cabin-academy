<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Séparer deux zones de cabine : cloison, rideau et meuble de rangement</title>
  <desc id="d">Schéma de principe : la cabine vue de face, en regardant vers l'avant, à l'endroit où deux zones sont séparées. À gauche de l'allée, une cloison de classe : un panneau rigide qui va du plancher jusque sous la bagagerie et qui épouse la courbe de la paroi ; son bord côté allée est protégé par un chant ; en bas, deux ferrures la fixent sur les rails de siège ; en haut, une fixation la relie à la bagagerie. À droite de l'allée, un meuble de rangement de même hauteur, fermé par une porte munie d'une poignée à verrou et de deux charnières, posé lui aussi sur les rails. Au-dessus de l'allée, un linteau ferme l'espace jusqu'au plafond et porte la tringle du rideau ; le rideau est ouvert, rassemblé contre le meuble et tenu par une embrasse.</desc>
