<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six outils à main : lesquels écarter ?</title>
  <desc id="d">Six vignettes d'outils à main dessinés verticalement, la pointe ou la bouche en haut ou en bas. Première ligne, trois tournevis : un tournevis plat dont la pointe est droite, aux angles nets ; un tournevis plat dont la pointe est arrondie et évasée, avec en pointillé la forme qu'elle devrait avoir ; un tournevis dont le manche est fendu par une fissure. Seconde ligne, trois clés plates vues de dessus : une clé dont les deux flancs de la bouche sont parallèles ; une clé dont la bouche est évasée, les flancs s'écartant vers l'ouverture, avec en pointillé la bouche d'origine ; une clé dont la poignée est prolongée par un tube sombre glissé dessus.</desc>
