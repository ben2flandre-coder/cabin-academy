<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" class="fig" role="img" aria-labelledby="t d">
  <title id="t">L'intérieur du fuselage, coupe de côté</title>
  <desc id="d">Schéma de principe : fuselage d'un avion de ligne coupé dans sa longueur, avant à gauche. De l'avant vers l'arrière : le nez avec son radôme ; le poste de pilotage ; sous le plancher du poste, une soute électronique ; la cabine passagers avec ses rangées de sièges, posée sur le plancher cabine qui court sur presque toute la longueur ; sous ce plancher, la soute avant, puis au milieu la zone du caisson de voilure et des logements de train, puis la soute arrière ; à l'arrière, une cloison étanche bombée ferme la partie habitée ; derrière elle, le cône arrière.</desc>
