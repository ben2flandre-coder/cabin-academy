<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Détrompage et repérage d'un connecteur</title>
  <desc id="d">Schéma de principe en deux parties. En haut, trois connecteurs ronds vus de face. La fiche porte deux ergots, un large en haut et un étroit en bas. La prise A possède deux rainures aux mêmes endroits : la fiche peut s'y engager, une coche verte le signale. La prise B, de même taille, a sa seconde rainure décalée sur le côté : la fiche ne peut pas s'y engager, une croix rouge le signale. En bas : l'extrémité d'un faisceau porte un manchon blanc marqué EX-A12, et l'équipement porte une étiquette EX-A12 à côté de sa prise ; les deux repères sont identiques. Les références sont fictives.</desc>
  <rect class="bgp" width="1000" height="660"/>
  <text class="ts tc" x="170" y="58">Fiche</text>
  <text class="ts tc" x="500" y="58">Prise A</text>
  <text class="ts tc" x="830" y="58">Prise B</text>
  <circle class="mt" cx="170" cy="196" r="100"/><circle class="in" cx="170" cy="196" r="74"/><circle class="dk" cx="170" cy="196" r="9.5"/><circle class="dk" cx="206.8" cy="205.8" r="9.5"/><circle class="dk" cx="179.8" cy="232.8" r="9.5"/><circle class="dk" cx="143.2" cy="222.8" r="9.5"/><circle class="dk" cx="133.2" cy="186.2" r="9.5"/><circle class="dk" cx="160.2" cy="159.2" r="9.5"/><circle class="dk" cx="196.8" cy="169.2" r="9.5"/>
