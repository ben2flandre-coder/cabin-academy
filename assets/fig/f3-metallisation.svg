<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Métallisation : tresse, contact métal sur métal, protection</title>
  <desc id="d">Schéma de principe en deux parties. En haut, vue d'ensemble : une pièce de structure et un équipement métallique sont séparés par un élément isolant ; une tresse souple munie d'une cosse à chaque bout les relie ; chaque cosse est vissée sur une zone de métal nu ; un appareil de mesure touche les deux pièces avec ses deux pointes pour vérifier la continuité. En bas, coupe d'un contact : la pièce métallique est peinte sauf sous la cosse, où le métal est nu ; la cosse est serrée par une vis, une rondelle et un écrou ; une couche de protection recouvre l'ensemble après la pose.</desc>
