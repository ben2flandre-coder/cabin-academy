<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Plan fictif d'un support (document pédagogique)</title>
  <desc id="d">Plan fictif, pédagogique. À gauche, la vue de face d'un support rectangulaire percé de quatre trous, avec une flèche de sens de montage ; un trait de coupe vertical repéré A-A le traverse. Trois bulles numérotées 1, 2 et 3 désignent des pièces par un trait. À droite, la coupe A-A montre l'épaisseur du support hachurée et deux vis. En dessous, la nomenclature : repère 1, EX-48213-01, quantité 1 ; repère 2, EX-90211-05, quantité 4 ; repère 3, EX-90305-02, quantité 4. En bas à gauche, les notes. En bas à droite, le cartouche : Support, plan EX-48213, indice C, échelle 1 : 2, feuille 1 sur 2.</desc>
