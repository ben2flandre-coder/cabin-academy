<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Ordre d’empilement d’une fixation boulonnée (coupe de principe)</title>
  <desc id="d">Coupe de principe d'un assemblage boulonné vertical. De haut en bas : tête hexagonale de la vis, rondelle sous tête, deux pièces serrées l'une sur l'autre traversées par le fût lisse de la vis, rondelle sous écrou, écrou, puis l'extrémité filetée qui dépasse de l'écrou. Deux flèches bleues opposées montrent la précharge qui pince les pièces ; une cote à gauche mesure l'épaisseur serrée. À droite, deux contre-exemples : en haut une vis trop courte, dont le filetage s'arrête à l'intérieur de l'écrou ; en bas une vis trop longue, dont l'écrou bute en fin de filetage en laissant un jeu au-dessus de la rondelle.</desc>
