<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Cinq clés à main</title>
  <desc id="d">Cinq clés dessinées à plat, l'une sous l'autre. Première : clé plate à fourche, avec une ouverture en U à chaque bout, de tailles différentes et légèrement inclinées. Deuxième : clé à œil, avec un anneau fermé à chaque bout dont l'intérieur est en étoile à douze pointes. Troisième : clé mixte, une fourche d'un côté et un œil de même taille de l'autre. Quatrième : clé à molette, avec un mors fixe, un mors mobile et une petite vis moletée dans la tête. Cinquième : clé mâle six pans en forme de L, de section hexagonale.</desc>
