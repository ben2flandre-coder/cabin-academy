<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les volumes de l'avion, vue de côté écorchée</title>
  <desc id="d">Schéma de principe d'un avion de ligne vu de côté, avant à gauche, fuselage ouvert. De l'avant vers l'arrière : le radôme, pointe avant non pressurisée ; un trait rouge vertical, la cloison étanche avant ; le poste de pilotage ; la cabine passagers avec ses hublots, ses sièges et une porte à chaque bout ; un trait rouge bombé, le fond étanche arrière ; le cône arrière non pressurisé. Un plancher sépare le haut du bas. Sous le plancher, de l'avant vers l'arrière : la baie avionique, la soute avant, le caisson central de voilure, le logement de train principal qui n'est pas pressurisé, la soute arrière. Les deux traits rouges marquent les extrémités de la zone pressurisée.</desc>
