<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">De la pièce à l'avion en service : les grandes étapes et la place de l'intégrateur cabine</title>
  <desc id="d">Schéma de principe en huit vignettes reliées par des flèches, à lire comme un texte. Première ligne : un, des morceaux séparés, tronçons de fuselage et aile ; deux, le fuselage assemblé avec ses lignes de jonction ; trois, le fuselage parcouru de câbles et de tuyaux orange, les systèmes. Deuxième ligne : quatre, le fuselage garni de sièges, l'aménagement de la cabine, avec un personnage orange qui représente l'intégrateur cabine ; cinq, l'avion complet à côté d'un cadran et d'une coche, les essais ; six, l'avion et une clé, la livraison. Troisième ligne : sept, l'avion en vol, la vie en service ; huit, l'avion sous un hangar avec une clé plate et de nouveau le personnage orange, la maintenance et la modification de cabine. Une double flèche relie les vignettes sept et huit.</desc>
