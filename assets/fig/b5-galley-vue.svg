  <title id="t">Galley vu de face</title>
  <desc id="d">Schéma de principe d'un galley (office) vu de face. En haut, une rangée de conteneurs standard et un tableau électrique. Au milieu, deux fours, une machine à boissons chaudes et un évier avec son robinet. Un plan de travail horizontal sépare le haut du bas. En bas, cinq chariots de service rangés côte à côte, chacun retenu par un verrou rabattu devant son bord supérieur, et un compartiment poubelle à volet.</desc>
