<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" class="fig" role="img" aria-labelledby="t d">
<title id="t">Anatomie du pied à coulisse à vernier</title>
<desc id="d">Pied à coulisse dessiné à plat, ouvert de 30 millimètres. Une règle graduée horizontale porte à gauche le bec fixe, dirigé vers le bas. Un coulisseau glisse sur la règle : il porte le bec mobile, face au bec fixe, le vernier sous la fenêtre de lecture, une vis de blocage au-dessus et une molette de déplacement en dessous. Au-dessus de la règle, deux petits becs d'intérieur pointent vers le haut. À droite, la jauge de profondeur sort du bout de la règle. Trois cotes bleues rappellent que la même ouverture, 30, se retrouve entre les grands becs, entre les faces extérieures des petits becs et sur la longueur sortie de la jauge de profondeur.</desc>
