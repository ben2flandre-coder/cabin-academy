<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">La cabine vue depuis l’allée, en regardant vers l’avant</title>
  <desc id="d">Schéma de principe en perspective : on se tient dans l'allée centrale et on regarde vers l'avant de l'avion. En haut au centre, les panneaux de plafond ; de chaque côté, la rangée des bacs à bagages fermés par leurs portes ; sous les bacs, la bande des PSU avec leurs liseuses ; entre le plafond et les bacs, un bandeau d'éclairage ; plus bas, les parois latérales percées de hublots ; au sol, l'allée bordée par les dossiers des sièges vus de dos ; tout au fond, une cloison ferme la cabine.</desc>
