<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Un cheminement à inspecter : neuf endroits à regarder</title>
  <desc id="d">Scène de contrôle, schéma de principe. Un faisceau parcourt une paroi en neuf endroits. Collier de gauche : faisceau tenu dans un collier à coussin. Traversée du haut : le faisceau repose sur le bord nu d'une cloison, sans passe-fil. Serre-câble : sa queue dépasse, non coupée. Portée sans collier : un support est vide, le faisceau pend et repose sur une lisse. Coude : le faisceau tourne avec un large rayon, tenu par un collier. Dérivation de droite : elle descend, fait une boucle sous le connecteur et remonte. Traversée du bas : un passe-fil garnit le trou, le faisceau est centré. Panneau d'accès : un panneau articulé est refermé sur le câble. Dérivation de gauche : elle est tendue en ligne droite et tire le connecteur de travers.</desc>
