<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Deux façons d'être étanche, trois façons de fuir</title>
  <desc id="d">Planche de schémas de principe. En haut à gauche, coupe d'un raccord métal sur métal : l'extrémité évasée d'un tube est plaquée par un écrou contre le cône du corps de raccord ; deux traits rouges marquent la portée, la surface de contact qui fait l'étanchéité. En haut à droite, coupe d'un raccord à joint torique : un anneau souple logé dans une gorge est écrasé contre une face plane, marquée en rouge ; deux flèches montrent le serrage. En bas, trois faces d'étanchéité vues de face, avec leur défaut : un joint torique pincé dont un morceau sort de sa place ; une face sans joint traversée par une rayure, avec une goutte qui s'échappe ; un joint sur lequel reposent un fil et un copeau.</desc>
