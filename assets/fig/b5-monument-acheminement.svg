<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Monument sur son chariot de manutention</title>
  <desc id="d">Schéma de principe d'un monument sanglé sur un chariot de manutention, vu de côté, roulant sur un plancher recouvert d'une protection. Des protections couvrent les angles du monument. Quatre mains montrent des prises possibles : une sur la poignée de manutention prévue en partie basse, une sur la barre de poussée du chariot, une sur la poignée d'une porte du meuble, une sur un raccord qui dépasse du dessus. Un outil est resté au fond d'un compartiment vide.</desc>
