<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" class="fig" role="img" aria-labelledby="t d">
  <title id="t">L'intégrateur cabine et les personnes avec qui il travaille</title>
  <desc id="d">Schéma de principe en étoile. Au centre, un personnage orange marqué « Toi » : l'intégrateur cabine. Autour, huit ronds reliés au centre par un trait, chacun avec un dessin : en haut, un personnage avec une étoile, le chef d'équipe ; en haut à droite, une feuille de consignes, les méthodes ; à droite, une loupe avec une coche, la qualité ; en bas à droite, un cadran de mesure, les essais ; en bas, un petit avion, le client ou la compagnie ; en bas à gauche, un connecteur et un câble orange, les équipes systèmes et électricité ; à gauche, un morceau de cadre et de peau, l'équipe structure ; en haut à gauche, un chariot chargé d'un carton, la logistique.</desc>
