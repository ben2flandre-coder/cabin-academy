<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Oxygène : le triangle du feu et ce qu'on tient à l'écart</title>
  <desc id="d">Schéma de principe en deux parties. À gauche, un triangle dont chaque sommet porte un symbole : en haut une bouteille de gaz, le comburant ; en bas à gauche des gouttes, le combustible ; en bas à droite un éclair, l'énergie d'allumage ; au centre, une flamme, qui n'existe que si les trois sont réunis. À droite, quatre objets : un tube de graisse, un chiffon taché et un gant taché, chacun barré d'une croix rouge ; puis l'extrémité d'un tube fermée par un capuchon de couleur vive, marquée d'une coche verte.</desc>
