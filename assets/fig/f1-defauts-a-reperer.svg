<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Derrière un panneau : faisceau et connecteurs à examiner</title>
  <desc id="d">Scène de principe : une cavité ouverte derrière un panneau, avec deux cadres verticaux. Un faisceau orange la traverse de gauche à droite ; il est tenu par un collier sur le cadre de gauche et porte une étiquette de repère. À gauche, une dérivation se termine par un connecteur en attente fermé par un bouchon. Au centre, deux équipements : sur le premier, un connecteur est accouplé à fond, bague contre l'embase ; sur le second, le connecteur est de travers et laisse voir l'embase entre la bague et l'équipement. À hauteur du cadre de droite, le faisceau n'est pas tenu : il pend et repose sur l'angle d'une équerre métallique, sa gaine est usée à cet endroit. À droite, une dérivation descend ; son isolant est entaillé et laisse voir le métal ; plus bas, elle disparaît sous le bord d'une plaque vissée et ressort de l'autre côté. En bas à gauche, un connecteur débranché sans bouchon, vu de face : une de ses broches est couchée et sa face est poussiéreuse.</desc>
