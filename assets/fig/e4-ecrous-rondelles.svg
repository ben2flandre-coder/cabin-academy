<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Familles d’écrous et de rondelles</title>
  <desc id="d">Planche de douze dessins. Écrous : écrou hexagonal vu de dessus et de côté ; écrou à créneaux vu de dessus avec ses six fentes et de côté ; écrou autofreiné en demi-coupe montrant la bague de nylon plus étroite que le filetage ; écrou autofreiné tout métal à collerette fendue et resserrée ; écrou prisonnier vu en coupe, plaquette rivetée derrière la structure, vis arrivant par l'autre face ; écrous en rail, trois écrous captifs dans une réglette ; écrou clip pincé à cheval sur le bord d'un panneau. Rondelles : plate ; fendue dite Grower ; éventail à dents ; conique élastique vue de dessus et en coupe ; cuvette logeant une tête fraisée au-dessus d'un panneau.</desc>
