  <rect class="sk" x="30" y="120" width="940" height="490" rx="14"/>
  <g data-part="cadre">
    <rect class="st" x="130" y="120" width="44" height="490"/>
    <rect class="st" x="430" y="120" width="44" height="490"/>
    <rect class="st" x="730" y="120" width="44" height="490"/>
  </g>
  <g data-part="support">
