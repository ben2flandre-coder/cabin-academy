<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Cheminement d'un faisceau le long de la structure</title>
  <desc id="d">Schéma de principe, vue de face depuis la cabine. Trois cadres verticaux portent chacun un support métallique. Sous chaque support, un collier à coussin maintient un faisceau de fils qui court horizontalement. Une double flèche montre l'espacement entre deux colliers. Une dérivation de deux fils quitte le faisceau, descend, forme une boucle dont le point bas se trouve sous le connecteur, puis remonte dans le connecteur placé sous un équipement. Une goutte tombe au point bas de la boucle.</desc>
