    <path class="sy" d="M30 237.5 L970 237.5"/>
    <path class="sy" d="M30 248.5 L970 248.5"/>
  </g>
  <g data-part="collier">
    <rect class="mt" x="142" y="190" width="20" height="22"/>,<rect class="dk" x="129" y="196" width="46" height="72" rx="9"/>,<circle class="mt" cx="152" cy="205" r="7"/>
    <rect class="mt" x="442" y="190" width="20" height="22"/>,<rect class="dk" x="429" y="196" width="46" height="72" rx="9"/>,<circle class="mt" cx="452" cy="205" r="7"/>
