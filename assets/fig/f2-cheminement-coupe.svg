    <rect class="mt" x="406" y="146" width="92" height="48" rx="6"/>,<circle class="wh" cx="426" cy="170" r="7"/>,<circle class="wh" cx="478" cy="170" r="7"/>
    <rect class="mt" x="706" y="146" width="92" height="48" rx="6"/>,<circle class="wh" cx="726" cy="170" r="7"/>,<circle class="wh" cx="778" cy="170" r="7"/>
  </g>
