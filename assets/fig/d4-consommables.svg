<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 565" class="fig" role="img" aria-labelledby="t d">
<title id="t">Six consommables courants du poste</title>
<desc id="d">Six cases. Chiffons non pelucheux : une pile de chiffons pliés dans leur emballage et un chiffon déplié. Collier de serrage : un collier fermé autour d'un toron de six câbles, tête à droite, et un collier neuf à plat avec sa tête et ses crans. Cales : une cale en biseau, une cale en bloc et une pile de cales minces. Ruban adhésif de masquage : un rouleau avec son amorce. Sachet refermable identifié : un sachet transparent à fermeture, une étiquette et trois vis à l'intérieur. Contenant à déchets : un bac à couvercle avec une fente où tombent une chute de collier et une rondelle.</desc>
