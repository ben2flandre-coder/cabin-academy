<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Quatre pinces</title>
  <desc id="d">Quatre pinces dessinées de profil, poignées à gauche et mors à droite. En haut à gauche, une pince universelle : bec large à bout carré avec une zone striée, un creux arrondi et des tranchants près de l'axe. En haut à droite, une pince à becs longs : deux becs fins qui s'effilent. En bas à gauche, une pince coupante diagonale : bec court et pointu dont toute la longueur est un tranchant. En bas à droite, une pince-étau : un corps droit terminé par une vis de réglage moletée, un mors fixe, un mors mobile, une poignée basse et un petit levier de déverrouillage.</desc>
  <rect class="bgp" width="1000" height="720"/>
