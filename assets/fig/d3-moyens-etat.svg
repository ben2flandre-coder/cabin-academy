<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 655" class="fig" role="img" aria-labelledby="t d">
<title id="t">Six moyens de mesure à examiner avant emploi</title>
<desc id="d">Six cases, chacune avec un moyen de mesure et, dessous, son étiquette de validité portant une échéance fictive au format mois/année. Case 1 : pied à coulisse intact, étiquette 09/26. Case 2 : pied à coulisse dont le bec fixe est ébréché au bout, étiquette 11/26. Case 3 : micromètre, étiquette 01/26. Case 4 : jauge de profondeur, étiquette 06/26. Case 5 : multimètre dont l'étiquette est déchirée, sans date lisible. Case 6 : jauge d'épaisseur à lames, étiquette 12/26.</desc>
