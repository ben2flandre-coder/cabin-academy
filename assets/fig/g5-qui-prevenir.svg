<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Qui prévenir, et pour quoi</title>
  <desc id="d">Schéma de principe en étoile. Au centre, toi. Une flèche épaisse monte vers le chef d'équipe, qui tient un bloc-notes. Des flèches plus fines partent vers quatre autres ronds : en haut à gauche, le collègue voisin, une clé à la main ; en haut à droite, la qualité, avec une loupe ; en bas à droite, la sécurité ou prévention, casque sur la tête, avec un bouclier ; en bas à gauche, les secours, représentés par un combiné de téléphone et une croix verte. En bas au centre, une feuille et un crayon : la trace écrite qui accompagne le signalement.</desc>
