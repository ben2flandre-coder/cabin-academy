<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Qui tient quoi dans la cabine : chaînes de fixation</title>
  <desc id="d">Schéma des liaisons, à lire de haut en bas : une flèche bleue signifie « est fixé sur », le trait orange signifie « est raccordé à ». Tout en bas, la structure primaire : peau, cadres et lisses. À gauche, la chaîne du plancher : le siège est fixé sur le rail, le rail et le panneau de plancher sont fixés sur la traverse, la traverse est fixée sur la structure. À droite, la chaîne du haut : le bloc de service passagers (PSU) est fixé sur la bagagerie ; la bagagerie, les panneaux d'habillage et les systèmes (conduits, faisceaux) sont fixés sur des supports, ferrures, biellettes et colliers, eux-mêmes fixés sur la structure. Un trait orange relie le PSU aux systèmes : il est raccordé à l'air, à l'électricité et à l'oxygène.</desc>
