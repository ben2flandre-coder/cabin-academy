<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Le fuselage est fait de tronçons assemblés bout à bout</title>
  <desc id="d">Schéma de principe en deux parties. En haut, un fuselage vu de côté, avant à gauche, dessiné en vue éclatée : cinq morceaux écartés les uns des autres, la pointe avant avec le poste de pilotage, le tronçon avant, le tronçon central qui porte l'attache de l'aile, le tronçon arrière, et le cône arrière avec la dérive. Entre deux morceaux, une double flèche marque la jonction qui fait le tour du fuselage. En bas, un détail agrandi de cette jonction vue en coupe : deux tôles de peau bout à bout, réunies par une bande intérieure, l'éclisse, traversée par quatre rivets.</desc>
