<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Cliquet, douilles et accessoires</title>
  <desc id="d">Trois bandes. En haut, un cliquet vu de dessus : un manche, une tête ronde, un petit levier inverseur sur la tête et, en pointillé, le carré d'entraînement situé dessous. Au milieu, la chaîne d'entraînement vue de côté, pièces écartées sur un même axe : la tête du cliquet avec son carré mâle muni d'une bille, une rallonge (carré femelle, barre, carré mâle), un cardan articulé, puis une douille dont le carré femelle est dessiné en pointillé. En bas, vues en bout : une douille six pans au creux hexagonal, une douille douze pans au creux en étoile à douze pointes, le dos d'une douille avec son trou carré, puis un porte-embout et un embout de vissage à corps hexagonal.</desc>
