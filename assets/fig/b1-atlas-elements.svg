<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Planche de reconnaissance : douze éléments de cabine</title>
  <desc id="d">Douze vignettes, chacune montrant la silhouette d'un élément de cabine. 1 : un siège passager vu de profil, sur son rail. 2 : un rail de siège, en coupe puis vu de dessus avec sa rangée de trous ronds reliés par une fente. 3 : un panneau de plancher, plaque sandwich dont la tranche montre l'âme en nid d'abeilles. 4 : un panneau latéral avec l'ouverture du hublot et son store à moitié baissé. 5 : un panneau de plafond vu d'en dessous, bordé de deux rampes lumineuses. 6 : une bagagerie vue de face, porte fermée, avec son verrou et, dessous, le bandeau du bloc de service. 7 : un bloc de service passagers vu d'en dessous : trois liseuses, trois aérateurs, un bouton d'appel, des consignes lumineuses, la trappe des masques et un masque à oxygène tombé. 8 : un galley vu de face, avec ses casiers, son four, son plan de travail et trois chariots. 9 : un module de toilettes vu de face, avec sa porte pliante. 10 : une cloison de séparation avec son rideau. 11 : le dos d'un siège avec écran, tablette et pochette. 12 : des interfaces : une ferrure en équerre, un connecteur électrique rond, un raccord de conduit et une tresse de métallisation.</desc>
