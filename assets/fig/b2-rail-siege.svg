<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Rail de siège et ferrure de pied : avant et après verrouillage</title>
  <desc id="d">Schéma de principe en trois vues. En haut à gauche, coupe transversale du rail : un profilé dont le sommet forme une gorge fermée par deux lèvres ; la tête du téton est retenue sous les lèvres. En haut à droite, vue de dessus du rail : une fente où alternent des ouvertures rondes larges et des parties étroites. Au milieu, vue A : la ferrure du pied de siège est posée, les têtes des tétons sont descendues par les ouvertures larges, le pion de verrouillage est resté levé sur une lèvre et le témoin est rouge. En bas, vue B : la ferrure a glissé d'un demi-pas, les têtes des tétons sont sous les lèvres, le pion est descendu dans une ouverture et le témoin est vert.</desc>
  <rect class="bgp" width="1000" height="760"/>
<text class="ts" x="30" y="46">Coupe</text><text class="ts" x="372" y="50">Vue de dessus</text>
  <rect class="in" x="39.2" y="104.2" width="72.6" height="52.8"/><rect class="in" x="248.2" y="104.2" width="72.6" height="52.8"/>
<text class="tb" x="40" y="288">A</text><text class="ts" x="80" y="288">— tétons posés</text>
<text class="tb" x="40" y="540">B</text><text class="ts" x="80" y="540">— glissé d’un demi-pas, verrouillé</text>
