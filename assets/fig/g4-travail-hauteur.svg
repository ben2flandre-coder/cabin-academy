<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Escabeau : bon usage et mauvais usage</title>
  <desc id="d">Deux dessins côte à côte d'un escabeau vu de face. À gauche, bon usage, marqué d'une coche verte : les patins sont à plat sur un sol dégagé, la personne se tient sur une marche intermédiaire, face aux marches, le corps entre les montants, une main sur la tablette haute, et travaille juste au-dessus d'elle ; ses outils sont dans une sacoche à la ceinture. À droite, mauvais usage, marqué d'une croix rouge : la personne est debout sur la tablette du haut, penchée loin sur le côté pour atteindre un panneau, un carton sous le bras, et un patin de l'escabeau repose sur un câble.</desc>
