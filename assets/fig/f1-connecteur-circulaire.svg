<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Connecteur circulaire : faces d’accouplement et vue de côté</title>
  <desc id="d">En haut, les deux faces d'accouplement d'un connecteur circulaire générique, vues de face. À gauche la fiche : bague de verrouillage moletée à l'extérieur, coque, isolant portant dix douilles, une clé de détrompage large en haut et quatre clés plus étroites réparties irrégulièrement. À droite l'embase, sur sa bride carrée à quatre trous : dix broches disposées en miroir des douilles, une rainure large en haut et quatre rainures étroites, trois ergots de baïonnette sur le pourtour. En bas, la paire accouplée vue de côté : câble, raccord arrière, bague de verrouillage avec un ergot visible dans son trou témoin, bride de l'embase plaquée sur une cloison, puis les fils qui repartent.</desc>
