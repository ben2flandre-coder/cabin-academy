<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" class="fig" role="img" aria-labelledby="t d">
  <title id="t">La fin de tâche : cinq gestes avant de clore</title>
  <desc id="d">Six vignettes numérotées. 1 : contrôler, une planche de vérification cochée et une loupe. 2 : nettoyer, un suceur d'aspirateur qui avale des poussières sur une surface. 3 : inventorier, un plateau d'outils et l'égalité 10 = 10 entre le compte d'avant et celui d'après. 4 : rechercher les corps étrangers, une lampe dont le faisceau éclaire un petit objet, et un miroir d'inspection. 5 : tracer, une fiche avec des lignes écrites, un stylo et un tampon. 6 : clore et passer la main, un panneau refermé avec ses quatre fixations et une coche verte.</desc>
