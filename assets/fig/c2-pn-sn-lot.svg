<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Une famille de pièces : même P/N, deux lots, six numéros de série</title>
  <desc id="d">Document fictif pédagogique. Six équerres métalliques identiques. Un bandeau en haut indique leur référence commune, P/N EX-48213-07. Elles sont rangées dans deux cadres : le lot EX-L2406 contient les pièces de numéros de série EX-000411, EX-000412 et EX-000413 ; le lot EX-L2411 contient les pièces EX-000527, EX-000528 et EX-000529. Même forme et même référence pour toutes, un numéro de série différent pour chacune.</desc>
