<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les familles d'aéronefs : aérostats et aérodynes</title>
  <desc id="d">Schéma de principe en deux rangées. Rangée du haut, les aérostats, plus légers que l'air : un ballon à air chaud avec sa nacelle, et un dirigeable allongé avec ses empennages et sa nacelle. Rangée du bas, les aérodynes, plus lourds que l'air : un planeur vu de dessus, aux ailes très longues et étroites, sans moteur ; un avion de ligne vu de dessus, avec deux moteurs sous des ailes en flèche ; un hélicoptère vu de côté, avec son grand rotor au-dessus de la cabine et son petit rotor de queue.</desc>
  <rect class="bgp" width="1000" height="640"/>
  <text class="tb" x="24" y="48">Aérostats : plus légers que l'air</text>
