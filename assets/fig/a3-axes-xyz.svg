    <ellipse class="dk" cx="140" cy="572" rx="10" ry="24"/><circle class="wh" cx="132" cy="572" r="12"/>
    <path class="dim" d="M114 572 L92 572"/><path class="dimf" d="M70 572 L94 560 L94 584 Z"/>
  </g>

  <g class="badges">
    <g class="badge" data-badge="axe-x" transform="translate(640 250)"><circle class="bd" r="24"/><text class="bn">1</text></g>
    <g class="badge" data-badge="axe-y" transform="translate(470 690)"><circle class="bd" r="24"/><text class="bn">2</text></g>
    <g class="badge" data-badge="axe-z" transform="translate(470 388)"><circle class="bd" r="24"/><text class="bn">3</text></g>
    <g class="badge" data-badge="avant" transform="translate(150 112)"><circle class="bd" r="24"/><text class="bn">4</text></g>
    <g class="badge" data-badge="arriere" transform="translate(852 372)"><circle class="bd" r="24"/><text class="bn">5</text></g>
    <g class="badge" data-badge="gauche" transform="translate(760 640)"><circle class="bd" r="24"/><text class="bn">6</text></g>
    <g class="badge" data-badge="droite" transform="translate(760 504)"><circle class="bd" r="24"/><text class="bn">7</text></g>
    <g class="badge" data-badge="observateur" transform="translate(190 572)"><circle class="bd" r="24"/><text class="bn">8</text></g>
