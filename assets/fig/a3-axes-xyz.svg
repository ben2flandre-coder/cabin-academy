    <path class="dim" d="M40 112 L120 112"/><path class="dimf" d="M22 112 L46 99 L46 125 Z"/>
    <text class="tb ta" x="24" y="160">FWD</text>
  </g>
  <g data-part="arriere">
    <rect class="sk" opacity="0" x="830" y="318" width="152" height="68" rx="8"/>
    <path class="dim" d="M880 338 L960 338"/><path class="dimf" d="M978 338 L954 325 L954 351 Z"/>
    <text class="tb ta te" x="976" y="386">AFT</text>
  </g>
  <g data-part="observateur">
