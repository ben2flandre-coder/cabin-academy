<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">PSU (bloc de service passager) : face de dessous et trappe des masques ouverte</title>
  <desc id="d">Schéma de principe en deux vues. En haut, le PSU vu de dessous, comme le voit un passager assis qui lève la tête : un long panneau tenu entre les deux bords d'une goulotte, avec à gauche la trappe du conteneur de masques à oxygène, au centre trois liseuses et trois bouches d'air individuelles orientables, à droite les signalisations lumineuses (ceinture, interdiction de fumer), le bouton d'appel et la grille du haut-parleur ; de part et d'autre du PSU, des panneaux de remplissage ferment la goulotte. En bas, vue de côté du même PSU, trappe ouverte : le conteneur est logé au-dessus du panneau, la trappe pend et quatre masques sont suspendus au bout de leur tuyau souple.</desc>
