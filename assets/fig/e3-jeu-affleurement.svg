<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Jeu et affleurement entre deux panneaux</title>
  <desc id="d">Cinq schémas, écarts volontairement exagérés. Rangée du haut, en coupe : premier schéma, deux panneaux côte à côte séparés par un espace, une cote horizontale mesure le jeu ; deuxième schéma, deux panneaux au même niveau, un réglet posé à cheval sur le joint touche les deux : ils affleurent ; troisième schéma, le panneau de droite est plus haut que celui de gauche, le réglet ne touche que lui et une cote verticale mesure le désaffleurement. Rangée du bas, de face : à gauche, deux panneaux séparés par un joint de largeur constante, jeu régulier ; à droite, un joint étroit en haut et large en bas, jeu en coin.</desc>
  <rect class="bgp" width="1000" height="720"/>
  <text class="ts" x="30" y="52">En coupe</text>
  <text class="ts" x="30" y="392">De face</text>
  <path class="dash" d="M30 348 L970 348"/>

  <!-- 1 jeu -->
  <g data-part="jeu">
    <rect class="none" pointer-events="all" x="30" y="70" width="300" height="270"/>
    <rect class="st" x="40" y="224" width="280" height="24"/>
    <rect class="in" x="40" y="176" width="112" height="48" rx="4"/>
    <rect class="in" x="208" y="176" width="112" height="48" rx="4"/>
    <path class="dim" d="M152 150 L208 150 M152 132 L152 172 M208 132 L208 172"/>
    <path class="dimf" d="M152 150 L170 140 L170 160 Z M208 150 L190 140 L190 160 Z"/>
    <text class="tb tc" x="180" y="304">Jeu</text>
  </g>
  <!-- 2 affleuré -->
  <g data-part="affleure">
    <rect class="none" pointer-events="all" x="350" y="70" width="300" height="270"/>
    <rect class="st" x="360" y="224" width="280" height="24"/>
    <rect class="in" x="360" y="176" width="130" height="48" rx="4"/>
    <rect class="in" x="510" y="176" width="130" height="48" rx="4"/>
    <rect class="mt" x="400" y="156" width="200" height="20"/>
    <path class="thin" d="M420 156 L420 166 M440 156 L440 166 M460 156 L460 166 M480 156 L480 166 M500 156 L500 166 M520 156 L520 166 M540 156 L540 166 M560 156 L560 166 M580 156 L580 166"/>
    <text class="tb tc" x="500" y="304">Affleuré</text>
  </g>
  <!-- 3 désaffleuré -->
  <g data-part="desaffleure">
    <rect class="none" pointer-events="all" x="670" y="70" width="300" height="270"/>
    <rect class="st" x="680" y="224" width="280" height="24"/>
    <rect class="in" x="680" y="176" width="130" height="48" rx="4"/>
    <path class="st" d="M830 180 L960 180 L960 224 L830 224 Z"/>
    <rect class="in" x="830" y="132" width="130" height="48" rx="4"/>
    <rect class="mt" x="720" y="112" width="200" height="20"/>
    <path class="thin" d="M740 112 L740 122 M760 112 L760 122 M780 112 L780 122 M800 112 L800 122 M820 112 L820 122 M840 112 L840 122 M860 112 L860 122 M880 112 L880 122 M900 112 L900 122"/>
    <path class="dim" d="M772 142 L772 166"/>
    <path class="dimf" d="M772 132 L762 150 L782 150 Z M772 176 L762 158 L782 158 Z"/>
    <text class="tb tc" x="820" y="304">Désaffleuré</text>
  </g>

  <!-- 4 jeu régulier -->
  <g data-part="jeu-regulier">
    <rect class="none" pointer-events="all" x="30" y="410" width="460" height="300"/>
    <rect class="in" x="60" y="420" width="180" height="210" rx="10"/>
    <rect class="in" x="270" y="420" width="180" height="210" rx="10"/>
    <circle class="okf" cx="255" cy="672" r="30"/>
    <path class="ln2" d="M240 672 L251 685 L272 658"/>
    <text class="tb" x="300" y="686">régulier</text>
  </g>
  <!-- 5 jeu en coin -->
  <g data-part="jeu-en-coin">
    <rect class="none" pointer-events="all" x="510" y="410" width="460" height="300"/>
    <rect class="in" x="540" y="420" width="180" height="210" rx="10"/>
    <path class="in" d="M741 421 L919 409 Q929 409 930 419 L942 607 Q942 617 932 618 L773 630 Q763 630 762 620 L731 431 Q731 421 741 421 Z"/>
    <circle class="badf" cx="735" cy="672" r="30"/>
    <path class="ln2" d="M722 659 L748 685 M748 659 L722 685"/>
    <text class="tb" x="780" y="686">en coin</text>
  </g>

  <g class="badges">
    <g class="badge" data-badge="jeu" transform="translate(64 104)"><circle class="bd" r="24"/><text class="bn">1</text></g>
    <g class="badge" data-badge="affleure" transform="translate(384 104)"><circle class="bd" r="24"/><text class="bn">2</text></g>
    <g class="badge" data-badge="desaffleure" transform="translate(694 96)"><circle class="bd" r="24"/><text class="bn">3</text></g>
    <g class="badge" data-badge="jeu-regulier" transform="translate(150 520)"><circle class="bd" r="24"/><text class="bn">4</text></g>
    <g class="badge" data-badge="jeu-en-coin" transform="translate(630 520)"><circle class="bd" r="24"/><text class="bn">5</text></g>
  </g>
</svg>
