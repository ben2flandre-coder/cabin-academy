<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Le couple : un effort multiplié par un bras de levier</title>
  <desc id="d">Deux schémas vus de dessus d'une clé posée sur un écrou situé à droite. En haut, une clé courte : une flèche rouge longue, perpendiculaire à la clé, pousse sur le bout du manche ; une cote bleue mesure le bras de levier, de l'axe de l'écrou jusqu'à la ligne de l'effort ; une flèche courbe bleue autour de l'écrou montre le couple, dans le sens des aiguilles d'une montre. En bas, une clé deux fois plus longue : la cote du bras de levier est doublée, la flèche d'effort est deux fois plus courte, et la flèche courbe du couple est identique.</desc>
