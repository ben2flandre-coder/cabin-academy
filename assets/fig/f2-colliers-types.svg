<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Trois moyens de tenir un faisceau, et une pose à éviter</title>
  <desc id="d">Planche en quatre cases. En haut à gauche, coupe d'un collier à coussin : une bande métallique en forme de boucle, doublée d'un coussin souple, entoure le faisceau ; ses deux pattes sont vissées sur un support. En haut à droite, coupe d'un serre-câble : une sangle plastique fait le tour du faisceau et se bloque dans une tête. En bas à gauche, vue de côté d'un faisceau tenu par trois lacets de frettage noués. En bas à droite, pose à éviter : un serre-câble trop serré étrangle les fils et sa queue n'a pas été coupée.</desc>
