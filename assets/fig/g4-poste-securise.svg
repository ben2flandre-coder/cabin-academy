<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Un poste de travail en cabine, avec des pièges</title>
  <desc id="d">Schéma de principe d'une zone de travail en cabine, vue face à la paroi, le plancher au premier plan. Contre la paroi, de gauche à droite : une servante d'outillage fermée, un siège recouvert d'une housse, un siège nu sur lequel est posée une visseuse avec des vis, un extincteur mural en partie caché par deux cartons empilés, un bac à déchets fermé. Au sol : une protection de plancher bien à plat et scotchée, une seconde protection dont un coin est retourné, une flaque de liquide, un bidon ouvert sans étiquette, et un enrouleur dont le câble traverse le passage jusqu'à une lampe accrochée à la paroi.</desc>
