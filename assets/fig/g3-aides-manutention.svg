<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six aides à la manutention et au poste</title>
  <desc id="d">Planche de six silhouettes d'équipements, schémas de principe. En haut : un chariot à plateau avec son timon et une caisse posée dessus ; un chariot porte-panneaux en forme de A, des panneaux appuyés de chaque côté ; une table élévatrice à ciseaux portant une caisse, avec une flèche vers le haut. En bas : un palan suspendu à une potence, dont le crochet tient une caisse par une élingue ; une poignée à deux ventouses collée sur un panneau lisse ; une plate-forme de travail individuelle avec marches et garde-corps.</desc>
