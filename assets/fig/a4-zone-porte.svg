<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Zone de porte pendant un chantier, vue de dessus : cherche ce qui gêne l'issue</title>
  <desc id="d">Vue de dessus d'une zone de porte pendant des travaux en cabine, avant à gauche. En haut, à l'extérieur, une passerelle d'accès est accostée devant l'ouverture ; la porte est ouverte et plaquée le long du fuselage. Sur le sol, juste derrière l'ouverture, une protection de seuil hachurée est en place. De chaque côté du passage, un meuble de cabine. Un chariot à outils est rangé le long du meuble de droite, hors du passage. Un bac marqué FOD est posé le long du meuble de gauche, hors du passage. Quatre anomalies : deux cartons empilés au milieu du passage ; une rallonge électrique orange qui serpente depuis la passerelle, passe sur le seuil et traverse le passage ; deux vis et une rondelle au sol près du seuil ; un panneau d'habillage posé debout contre la porte ouverte.</desc>
