    <circle class="wh" cx="262" cy="250" r="88"/>
    <text class="tb tc" x="262" y="150">O</text>
    <text class="tb tc" x="374" y="264">I</text>
    <circle class="mt2" cx="262" cy="250" r="30"/>
    <rect class="dk" x="246" y="170" width="32" height="106" rx="12"/>
  </g>
  <g data-part="circuit">
