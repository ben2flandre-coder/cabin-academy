<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Principe de la consignation d'une énergie</title>
  <desc id="d">Schéma de principe. À gauche, une arrivée d'énergie alimente un coffret dont la poignée de l'organe de séparation est sur la position O (ouvert). Un cadenas rouge bloque la poignée et une étiquette d'interdiction de manœuvrer y est attachée. Le circuit en aval, dessiné en pointillé et barré, relie le coffret à un équipement. En bas, une personne garde la clé du cadenas. À droite, un testeur affiche zéro : l'absence d'énergie a été vérifiée sur le circuit séparé.</desc>
