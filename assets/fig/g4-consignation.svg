  <g data-part="source">
    <path class="sy" d="M30 150 L150 150"/>
    <path class="syf" d="M40 96 L78 96 L62 132 L86 132 L44 196 L54 150 L34 150 Z"/>
  </g>
  <g data-part="organe">
