<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Plancher de cabine : coupe transversale et détail autour d’un rail</title>
  <desc id="d">Schéma de principe en deux parties. En haut, coupe transversale de la moitié basse du fuselage, vue vers l'avant : le cadre circulaire porte une traverse de plancher horizontale, soutenue par deux bielles ; sur la traverse sont posés quatre rails de siège vus en bout, et entre les rails des panneaux de plancher recouverts d'un revêtement. En bas, détail agrandi autour d'un rail : le rail est un profilé dont le sommet forme une gorge ; de chaque côté, un panneau de plancher repose sur une aile du rail ; le panneau est un sandwich fait de deux peaux minces et d'une âme en nid d'abeilles ; le revêtement de sol est posé par-dessus.</desc>
