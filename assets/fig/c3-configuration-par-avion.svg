<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Une même zone de cabine, deux avions, deux configurations</title>
  <desc id="d">Schéma de principe, vues de dessus, avant à gauche. En haut, l'avion fictif EX-101 avec son propre dossier : huit rangées de sièges de part et d'autre de l'allée et une cloison placée après la deuxième rangée. En bas, l'avion fictif EX-102 avec un autre dossier : la même zone, mais la cloison est placée après la cinquième rangée et, côté haut du dessin, les deux dernières rangées sont remplacées par un meuble. Les sièges restants sont identiques dans les deux avions.</desc>
