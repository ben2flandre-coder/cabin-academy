<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Comment tient un panneau : six familles de fixations, en coupe</title>
  <desc id="d">Planche de six schémas de principe en coupe. Un : un panneau sandwich, fait de deux peaux minces et d'une âme en nid d'abeilles, avec un insert noyé dans l'âme ; une vis et sa rondelle traversent le pied d'une équerre et se vissent dans l'insert. Deux : une équerre rivetée sur un cadre de structure tient un panneau par l'intermédiaire d'un amortisseur en caoutchouc. Trois : une agrafe fixée au dos d'un panneau se referme sur un téton à tête ronde porté par un support. Quatre : un pion de centrage à bout conique, porté par le panneau, entre dans le trou d'un support. Cinq : un verrou quart de tour vu de face, avec sa fente et une flèche d'un quart de tour, et vu en coupe, avec sa tige à barrette prise dans un réceptacle. Six : deux panneaux bord à bord et le couvre-joint enfoncé dans l'intervalle.</desc>
