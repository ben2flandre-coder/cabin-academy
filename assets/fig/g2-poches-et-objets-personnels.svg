<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Poches et objets personnels avant d'entrer en zone</title>
  <desc id="d">Schéma de principe. À gauche, une personne vue de face en tenue de travail porte des lunettes de protection et plusieurs objets susceptibles de tomber : une barrette dans les cheveux, un badge pendu à un cordon, des stylos dans la poche de poitrine, un téléphone qui dépasse d'une poche, des clés et de la monnaie dans l'autre poche, une montre et une bague. À droite d'un trait pointillé, trois réponses : un bac à effets personnels contenant téléphone, clés et montre ; un outil relié au poignet par une longe ; une boîte fermée contenant cinq vis comptées.</desc>
