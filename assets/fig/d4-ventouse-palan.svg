<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" class="fig" role="img" aria-labelledby="t d">
<title id="t">Ventouse de manutention et palan à chaîne : le principe</title>
<desc id="d">À gauche, une ventouse de manutention double vue de face, plaquée sur un grand panneau lisse : deux coupelles rondes en caoutchouc reliées par une poignée, chacune avec un levier rouge qui crée le vide quand on le rabat. À droite, un palan à chaîne à main suspendu à une poutre par son crochet haut : un carter avec sa roue, une plaque marquée CMU, la chaîne de manœuvre qui pend en boucle sur le côté et que l'on tire à la main, la chaîne de levage qui descend jusqu'au crochet bas muni d'un linguet de sécurité ; une charge est suspendue au crochet par une élingue.</desc>
