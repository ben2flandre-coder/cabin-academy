<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Le dos d'un siège passager et ses équipements</title>
  <desc id="d">Schéma de principe du dos d'un siège passager, tel que le voit le passager assis derrière. De haut en bas : une étiquette indiquant que le gilet est sous le siège, un écran individuel, un bandeau de prises (casque, USB, secteur), la tablette relevée, la carte de consignes de sécurité qui dépasse de la pochette. Sous le siège : la pochette du gilet de sauvetage et un boîtier électronique fixé à la structure du siège. Un câble descend du boîtier et longe le rail au sol ; à gauche il est caché par le cache de rail, à droite le cache est retiré et on voit le câble.</desc>
