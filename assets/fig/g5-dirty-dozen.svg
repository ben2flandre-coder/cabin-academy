<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 752" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les douze facteurs humains (« Dirty Dozen »)</title>
  <desc id="d">Planche de douze pictogrammes rangés en trois lignes de quatre, numérotés de 1 à 12. 1 : une bulle de parole barrée (manque de communication). 2 : un téléphone qui vibre (distraction). 3 : trois emplacements d'outils dont un vide, en pointillé (manque de ressources). 4 : une tête surmontée de deux éclairs (stress). 5 : un visage aux yeux fermés qui sourit à côté d'une coche (excès de confiance). 6 : deux personnes séparées par un mur (manque de travail d'équipe). 7 : un chronomètre avec des traits de vitesse (pression). 8 : un œil entre deux œillères (manque de vigilance). 9 : un livre ouvert sous un point d'interrogation (manque de connaissances). 10 : une pile presque vide (fatigue). 11 : une personne dont la bulle de parole, en pointillé, reste vide (manque d'affirmation de soi). 12 : un chemin officiel en pointillé à angle droit, coupé par une flèche rouge en diagonale que suit un petit groupe (normes de groupe).</desc>
