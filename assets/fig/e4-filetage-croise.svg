<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Filetage bien engagé et filetage croisé (coupe)</title>
  <desc id="d">Deux coupes d'une vis entrant dans un trou taraudé. À gauche, la vis est dans l'axe du trou : ses filets se logent exactement dans ceux du taraudage sur toute la hauteur engagée, un seul axe bleu commun. À droite, la vis est présentée de travers : son axe rouge fait un angle avec l'axe bleu du trou, les premiers filets se chevauchent au lieu de s'emboîter et s'arrachent à l'entrée, zones marquées en rouge.</desc>
