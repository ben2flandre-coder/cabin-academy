<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Anatomie d'une clé dynamométrique à déclenchement</title>
  <desc id="d">Deux vues d'une clé dynamométrique à déclenchement, poignée à gauche et tête à droite. Vue de dessus : un bouton de verrouillage en bout de poignée, la poignée moletée avec un anneau clair qui marque le milieu de la prise en main, une bague graduée au bord de la poignée, puis le corps tubulaire qui porte une échelle gravée et une étiquette d'étalonnage, enfin la tête ronde à cliquet avec son petit levier inverseur ; le carré d'entraînement, situé dessous, est en pointillé. Vue de côté en coupe de principe : dans le tube, de gauche à droite, la vis de réglage solidaire de la poignée, un ressort, un bloc basculant, puis un levier articulé relié à la tête ; sous la tête dépasse le carré d'entraînement avec sa bille.</desc>
