<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Coupe de la cabine d'un avion monocouloir, vue de l'arrière vers l'avant</title>
  <desc id="d">Schéma de principe d'une coupe transversale de cabine, regardée depuis l'arrière vers l'avant : le côté gauche de l'avion (LH) est à gauche de l'image. De l'extérieur vers l'intérieur : la peau du fuselage, un cadre circulaire, le matelas isolant, puis le panneau latéral avec le hublot et, au ras du sol, le panneau dado à grille. En bas : la traverse de plancher, les rails de sièges et les panneaux de plancher. Dans la cabine : deux groupes de trois sièges vus de dos, séparés par l'allée. En haut : les bagageries de chaque côté, les blocs de service passagers (PSU) dessous, le panneau de plafond au centre, les rampes d'éclairage, et au-dessus du plafond les conduits d'air et les faisceaux électriques dans leurs goulottes.</desc>
