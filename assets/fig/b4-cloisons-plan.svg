<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Où sont les cloisons : une cabine vue de dessus</title>
  <desc id="d">Schéma de principe, très raccourci, d'une cabine à un couloir vue de dessus, avant de l'avion à gauche. Tout à l'avant, la cloison du poste de pilotage avec sa porte. Viennent ensuite deux portes passagers face à face, puis deux cloisons d'entrée qui protègent la première rangée. La zone avant compte deux rangées de sièges larges, deux de chaque côté de l'allée. Une cloison de classe de chaque côté et un rideau en travers de l'allée la séparent de la zone arrière, où quatre rangées de trois sièges encadrent l'allée. À l'arrière, un meuble de rangement d'un côté et un bloc toilettes de l'autre, avec sa porte qui s'ouvre vers l'allée, puis deux autres portes passagers.</desc>
