<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six postures de travail comparées</title>
  <desc id="d">Six silhouettes de profil, sur deux rangées. Rangée du haut : une personne soulève une caisse jambes tendues et dos arrondi ; une personne soulève la même caisse jambes fléchies, dos droit, tout près de la caisse ; une personne porte une caisse à bout de bras, loin du corps. Rangée du bas : une personne porte une caisse contre son ventre ; une personne travaille sous un élément de plafond bras tendus au-dessus de la tête, nuque cassée, sur la pointe des pieds ; la même personne fait le même travail debout sur une plate-forme, les mains à hauteur du visage, coudes fléchis, nuque droite.</desc>
