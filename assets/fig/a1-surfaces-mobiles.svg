<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les surfaces mobiles d'un avion de ligne, vue de dessus</title>
  <desc id="d">Schéma de principe, vue de dessus, avant à gauche. Sur chaque aile : au bord d'attaque, une bande de becs ; au bord de fuite, près du fuselage, les volets ; au bord de fuite, vers l'extrémité de l'aile, l'aileron ; sur le dessus de l'aile, juste devant les volets, une rangée de spoilers. À l'arrière, sur le stabilisateur horizontal, la gouverne de profondeur occupe le bord de fuite. Un encart en haut à droite montre la dérive vue de côté avec, à l'arrière, la gouverne de direction. Les gouvernes de pilotage sont en orange, les becs et volets en bleu, les spoilers en gris.</desc>
