<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Six façons d'utiliser une clé dynamométrique</title>
  <desc id="d">Six vignettes légendées. Sur la poignée : une main tient la clé au milieu de sa poignée, une flèche rouge pousse perpendiculairement, une flèche courbe indique le sens du serrage. Sur le tube : la main tient la clé par le corps, près de la tête. Tube rallonge : un tube est enfilé sur la poignée pour allonger la clé, la main pousse au bout du tube. Pour desserrer : la main est sur la poignée mais la flèche d'effort et la flèche courbe sont dans le sens inverse. Après une chute : la clé est par terre, une flèche montre la chute et des traits rouges marquent le choc sur la tête. Dans son coffret : la clé est rangée dans un coffret à deux fermoirs.</desc>
