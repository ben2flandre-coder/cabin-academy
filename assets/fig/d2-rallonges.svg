<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Rallonge et prolongateur : ce qui change le bras de levier</title>
  <desc id="d">Trois schémas d'une clé dynamométrique, poignée à gauche. Premier, vu de côté : la clé est horizontale ; sous sa tête, une rallonge verticale et une douille descendent jusqu'à la vis, dans l'axe de celle-ci ; une cote bleue mesure le bras de levier, du milieu de la poignée à l'axe de la vis. Deuxième, vu de dessus : un prolongateur plat est emboîté sur le carré de la clé et s'étend dans le prolongement de la clé jusqu'à un écrou situé plus loin ; la cote bleue du bras de levier s'arrête au carré de la clé, et une cote rouge mesure le décalage supplémentaire entre le carré et l'écrou. Troisième, vu de dessus : le même prolongateur est monté à angle droit par rapport à la clé ; l'écrou est décalé sur le côté, la cote bleue du bras de levier, mesurée le long de la clé, est inchangée, et la cote rouge du décalage est perpendiculaire à la clé.</desc>
