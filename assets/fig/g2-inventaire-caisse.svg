<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Caisse à empreintes : inventaire d'un tiroir</title>
  <desc id="d">Schéma de principe d'un tiroir de caisse à outils garni d'une mousse sombre découpée en empreintes à fond orange, vu de dessus. Chaque outil a son logement : un cliquet, une rallonge, une rangée de cinq douilles, un porte-embouts de quatre embouts, deux tournevis, une pince coupante, un miroir d'inspection et une lampe. Trois écarts sont visibles : une empreinte de douille vide, un logement d'embout vide et une clé plate posée sur la mousse sans empreinte. Une étiquette porte l'identifiant fictif de la caisse et le nombre d'outils attendu.</desc>
