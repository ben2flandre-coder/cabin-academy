  <rect class="eq2" x="387.2" y="342.4" width="80.4" height="31.2" rx="15"/><ellipse class="dk" cx="395.6" cy="358" rx="6" ry="12"/><path class="st" d="M428 334.6 L542 319 L568.4 319 L568.4 323.2 L514.4 338.8 L437 338.8 Z"/>
  <g data-part="portance"><path class="eq2" d="M522 236 L522 110 L552 110 L500 40 L448 110 L478 110 L478 236 Z"/></g>
  <g data-part="poids"><path class="dk" d="M478 372 L478 498 L448 498 L500 568 L552 498 L522 498 L522 372 Z"/></g>
  <g data-part="traction"><path class="syf" d="M214 290 L100 290 L100 260 L30 312 L100 364 L100 334 L214 334 Z"/></g>
