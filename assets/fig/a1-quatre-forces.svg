<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les quatre forces qui s'exercent sur un avion en vol</title>
  <desc id="d">Schéma de principe : un avion de ligne vu de côté, nez à gauche, en vol horizontal. Quatre grandes flèches partent de l'avion : une vers le haut à partir de l'aile, la portance ; une vers le bas, le poids ; une vers l'avant à partir du nez, la traction ou poussée des moteurs ; une vers l'arrière à partir de la queue, la traînée. Les flèches verticales ont la même longueur, les flèches horizontales aussi : en vol stabilisé, les forces s'équilibrent deux à deux.</desc>
  <rect class="bgp" width="1000" height="600"/>
