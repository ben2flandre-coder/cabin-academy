    <text class="ts tc" x="292" y="142">20</text>
  </g>
  <g data-part="bord">
    <rect class="none" x="350" y="402" width="60" height="110"/>
    <path class="dim" d="M380 406 L380 492"/>
  </g>
  <g class="badges">
    <g class="badge" data-badge="echelle" transform="translate(842 128)"><circle class="bd" r="26"/><text class="bn">1</text></g>
