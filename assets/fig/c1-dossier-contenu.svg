  <title id="t">Ce que contient un dossier de travail</title>
  <desc id="d">Schéma de principe d'une chemise ouverte contenant six documents. Un plan : un dessin de pièce avec une bulle de repère et un cartouche dans l'angle. Une nomenclature : un tableau de lignes numérotées. Une instruction de travail : une suite d'opérations numérotées 10, 20, 30. Une fiche de suivi : un tableau dont les premières lignes sont tamponnées et signées. Une liste de contrôle : des cases dont trois sont cochées. Une étiquette d'identification avec son lien d'attache et un code à barres.</desc>
