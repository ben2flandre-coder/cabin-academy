<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Porter à deux : rôles, prises et trajet</title>
  <desc id="d">Schéma de principe, vue de profil. Deux personnes marchent dans le même sens, vers la droite, et portent ensemble un long panneau tenu sur chant le long de leur corps. Celle de gauche annonce le décompte un, deux, trois : elle commande la manœuvre. Les mains des deux porteuses, entourées d'un cercle, saisissent le panneau à la même hauteur. Une flèche et un pointillé au sol indiquent le trajet reconnu. Devant elles, un seuil signalé par un triangle d'avertissement, puis des tréteaux garnis de mousse préparés pour la dépose.</desc>
