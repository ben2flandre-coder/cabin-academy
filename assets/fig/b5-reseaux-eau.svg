<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les trois circuits d'eau d'un galley et de toilettes</title>
  <desc id="d">Schéma de principe vu de côté. Au-dessus du plancher, à gauche un galley avec son évier, à droite une cellule de toilettes avec son lavabo et sa cuvette. Sous le plancher, un réservoir d'eau potable et un réservoir d'eaux usées. Trait bleu : l'eau potable monte du réservoir vers le robinet du galley et celui du lavabo. Trait orange : l'eau de l'évier et du lavabo descend par écoulement jusqu'à un mât de drainage sous le fuselage. Trait rouge : le contenu de la cuvette passe par une vanne de chasse et rejoint le réservoir d'eaux usées, que l'on vide au sol par un panneau de service.</desc>
