<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
<title id="t">Trois lectures de vernier au dixième à faire seule</title>
<desc id="d">Trois vues très agrandies de la zone de lecture d'un pied à coulisse à vernier au dixième, repérées C, D et E, sans la réponse. Chaque vue montre en haut la règle graduée en millimètres, chiffrée tous les dix millimètres, et en dessous le vernier de dix divisions numéroté 0, 5 et 10. Lecture C : le zéro du vernier est entre 22 et 23 et c'est le septième trait du vernier qui est aligné avec un trait de la règle. Lecture D : le zéro du vernier est exactement en face du trait 8 de la règle, et le dixième trait est lui aussi aligné. Lecture E : le zéro du vernier est juste avant le trait 40 et c'est le neuvième trait du vernier qui est aligné.</desc>
