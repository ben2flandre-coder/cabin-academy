<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les lieux de travail autour de l'avion</title>
  <desc id="d">Plan de principe d'un hall d'assemblage vu de dessus, avec des pictogrammes. En haut, trois locaux côte à côte : le magasin d'outillage, avec un panneau d'outils et une caisse ; la zone logistique, avec une étagère de cartons et un chariot chargé ; le point d'équipe, avec un tableau d'affichage et un personnage. Au milieu, une allée de circulation bordée de deux lignes, avec deux piétons. En bas, l'avion vu de dessus, nez à gauche ; à l'intérieur du fuselage, une bande claire marque la cabine. Quatre plateformes d'accès longent le fuselage, deux de chaque côté, avec chacune un escalier. À droite de l'avion, en haut, trois bacs de tri ; en bas, un établi avec un étau.</desc>
