<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 756" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Coupe transversale d'un fuselage d'avion de ligne</title>
  <desc id="d">Schéma de principe : fuselage rond coupé en travers, vu depuis l'arrière vers l'avant, côté gauche de l'avion à gauche de l'image. De l'extérieur vers l'intérieur : la peau, mince enveloppe extérieure ; contre elle, de petites sections sombres régulièrement réparties, les lisses ; à l'intérieur, un anneau, le cadre. Une poutre horizontale, la traverse de plancher, relie les deux côtés du cadre un peu en dessous du milieu ; elle porte quatre rails de sièges et les panneaux du plancher cabine. Deux contrefiches presque verticales soutiennent la traverse. Plus bas, le plancher de soute, et tout en bas l'espace du fond de cale. De chaque côté, à hauteur de passager assis, une fenêtre et son encadrement traversent la peau. Une silhouette debout donne l'échelle.</desc>
