<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">La paroi de la cabine : coupe et vue depuis la cabine</title>
  <desc id="d">Schéma de principe en deux vues alignées à la même hauteur. À gauche, coupe de la paroi gauche de la cabine, vue vers l'avant, du plancher jusqu'au bas de la bagagerie. De l'extérieur vers l'intérieur : la peau, un cadre, le matelas isolant, un espace où passe un faisceau électrique, puis le panneau latéral tenu au cadre par des supports. À mi-hauteur, le hublot interrompt la peau, le cadre et l'isolant : ses vitres sont tenues dans un cadre de hublot fixé à la peau ; le panneau latéral forme un entonnoir vers le hublot et porte une vitre intérieure et un store. En bas, le panneau dado, incliné, rejoint le plancher ; une flèche montre l'air de la cabine qui traverse sa grille pour descendre sous le plancher. À droite, la même paroi vue depuis la cabine : un panneau latéral avec deux hublots, l'un store à moitié baissé, l'autre store levé ; la jonction avec le panneau voisin ; en bas le panneau dado et sa grille ; au sol, le plancher.</desc>
