<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Traversée de cloison : passe-fil, manchon, colliers</title>
  <desc id="d">Schéma de principe en deux vues. À gauche, coupe : un faisceau horizontal traverse une cloison par un trou dont le bord est garni d'un passe-fil souple ; le faisceau porte un manchon de protection à cet endroit ; de chaque côté, un collier suspendu à un support le maintient centré dans le trou. À droite, vue de face du trou : la couronne du passe-fil, le faisceau au centre, et un jeu libre entre les deux.</desc>
  <rect class="bgp" width="1000" height="620"/>
  <text class="ts" x="30" y="50">Coupe</text>
  <text class="ts" x="690" y="50">Vue de face</text>
  <path class="thin" d="M668 24 L668 596"/>
