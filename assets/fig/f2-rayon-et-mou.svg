<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Rayon de courbure et mou : ce qui se voit</title>
  <desc id="d">Planche en cinq schémas de principe, sans valeur chiffrée. En haut à gauche, un faisceau de trois fils tourne à angle droit en décrivant un large arc entre deux colliers ; une flèche partant du centre de l'arc montre le rayon de courbure. En haut à droite, le même trajet avec un pli serré : les fils tournent presque à angle vif, des traits rouges marquent l'endroit. En bas, trois dérivations entre un collier et le connecteur d'un équipement : la première est tendue en ligne droite et tire le connecteur de travers ; la deuxième arrive avec une courbe douce ; la troisième forme une boucle de longueur en trop qui pend.</desc>
  <rect class="bgp" width="1000" height="700"/>
  <path class="thin" d="M500 24 L500 356"/>
  <path class="thin" d="M24 372 L976 372"/>
  <text class="ts tc" x="255" y="58">Rayon large</text>
  <text class="ts tc tr" x="745" y="58">Pli serré</text>
