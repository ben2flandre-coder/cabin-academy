<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les interfaces d'un galley, vu en coupe</title>
  <desc id="d">Schéma de principe en coupe d'un galley installé. Le meuble repose sur le plancher, où deux ferrures le retiennent en partie basse. En partie haute, deux bielles inclinées le relient à la structure de l'avion, au-dessus du plafond. Un faisceau électrique arrive par le haut sur un connecteur. Un conduit souple relie le dessus du meuble au conduit de ventilation. Sous le plancher, un tuyau amène l'eau potable jusqu'au robinet ; un second tuyau part de l'évier, traverse le plancher et rejoint le mât de drainage sous le fuselage.</desc>
