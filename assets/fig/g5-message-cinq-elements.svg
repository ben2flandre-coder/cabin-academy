    <path class="wh" d="M231 22 H769 a16 16 0 0 1 16 16 V468 a16 16 0 0 1 -16 16 H231 a16 16 0 0 1 -16 -16 V420 L150 404 L215 372 V38 a16 16 0 0 1 16 -16 Z"/>
  </g>
