<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Un message clair : cinq éléments, puis la reformulation</title>
  <desc id="d">Schéma de principe. À gauche, la personne qui parle. Au centre, son message sous la forme d'une grande bulle découpée en cinq lignes, chacune avec un pictogramme et un mot : QUI (une silhouette), OÙ (une épingle de localisation), QUOI (un œil), QUAND (une horloge), ET DONC (une flèche vers un triangle d'avertissement). À droite, la personne qui reçoit le message, un bloc-notes à la main. En bas, une flèche revient du destinataire vers l'émetteur, avec une petite bulle cochée : le destinataire reformule ce qu'il a compris.</desc>
  <rect class="bgp" width="1000" height="670"/>
