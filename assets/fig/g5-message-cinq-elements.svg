    <path class="eq2" d="M259 105 C259 81 271 75 285 75 C299 75 311 81 311 105 Z"/>
    <circle class="wh" cx="285" cy="61" r="13"/>
    <text class="tb" x="340" y="91">QUI ?</text>
  </g>
  <g data-part="ou">
