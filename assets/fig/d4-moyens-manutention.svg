<title id="t">Atlas des moyens de manutention</title>
<desc id="d">Douze cases, un moyen par case : chariot de siège portant une rangée de trois sièges ; chariot de monument portant un grand meuble debout retenu par deux sangles ; table élévatrice à ciseaux ; potence avec son palan et son crochet ; élingue plate à deux boucles avec son étiquette ; sangle d'arrimage à cliquet avec ses deux crochets ; diable à deux roues portant un carton ; plateau à roulettes ; gabarit de transport en forme de A portant deux panneaux inclinés ; bac de transport ; plaque de capacité marquée « MAX … kg » ; roulette pivotante avec sa pédale de frein rouge.</desc>
