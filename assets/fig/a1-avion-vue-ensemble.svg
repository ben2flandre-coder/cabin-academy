<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Avion de ligne : vue de côté, vue de dessus et vue de face</title>
  <desc id="d">Schéma de principe d'un avion de ligne à fuselage unique et à deux moteurs. En haut, grande vue de côté, avant à gauche : le fuselage contient le poste de pilotage au nez, la cabine passagers dans la partie haute et la soute dans la partie basse ; on voit deux portes, la dérive verticale à l'arrière, l'aile basse, un moteur suspendu sous l'aile, le train avant et le train principal. En bas à gauche, petite vue de dessus : les deux ailes en flèche, les deux moteurs en avant des ailes et le stabilisateur horizontal à l'arrière ; l'envergure est presque égale à la longueur. En bas à droite, petite vue de face : le fuselage rond, les ailes légèrement relevées, les deux moteurs sous les ailes, la dérive et les trains.</desc>
