<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Le hublot en coupe : de la vitre extérieure au store</title>
  <desc id="d">Schéma de principe en deux vues, épaisseurs fortement grossies. À gauche, coupe verticale d'un hublot, extérieur de l'avion à gauche et cabine à droite. Dans l'ouverture de la peau, un cadre de hublot riveté à la peau reçoit deux vitres épaisses tenues ensemble par un joint : la vitre extérieure, au ras de la peau, et la vitre médiane, percée d'un petit trou vers le bas ; des brides de maintien serrent l'ensemble contre le cadre. Plus à droite, séparé par un espace d'air, le panneau latéral forme un entonnoir, l'encadrement, qui porte une vitre intérieure mince puis, côté cabine, le store ; le store est à moitié baissé et un tracé en tirets montre le logement où il remonte. À droite, le même hublot vu de la cabine une fois le panneau latéral déposé : la peau, le cadre de hublot, le joint, la vitre médiane avec son petit trou en bas, et six brides de maintien.</desc>
