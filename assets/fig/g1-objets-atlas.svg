<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Douze objets étrangers typiques d'un chantier cabine</title>
  <desc id="d">Planche de reconnaissance en douze cases, dessins au trait sans échelle commune. Première rangée : une vis ; une rondelle et un écrou ; des copeaux en spirale avec de la limaille ; une queue de serre-câble coupée en biseau. Deuxième rangée : une chute de fil dénudé avec un morceau de gaine ; une étiquette décollée au coin corné ; un capuchon et un bouchon de protection de couleur vive ; un sachet d'emballage vide. Troisième rangée : un embout de vissage et un foret ; un chiffon ; un stylo ; une bague et une clé.</desc>
