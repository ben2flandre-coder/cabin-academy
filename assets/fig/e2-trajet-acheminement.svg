<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Un trajet d'acheminement vu de dessus</title>
  <desc id="d">Plan vu de dessus. En bas à gauche, un local de réception où attend l'élément emballé : c'est le départ. Le trajet, tracé en pointillé bleu, sort par la porte du local, franchit un câble posé au sol, contourne un obstacle laissé dans le passage, longe sans l'encombrer la zone hachurée devant une issue de secours, marque un arrêt dans une zone d'attente au pied de la passerelle, monte la passerelle, franchit le seuil de la porte de l'avion et se termine dans la cabine, sur une zone de dépose protégée. L'avion occupe le haut du plan, avant à gauche.</desc>
  <rect class="bgp" width="1000" height="690"/>
  <!-- avion (tronçon de fuselage vu de dessus) -->
  <rect class="sk" x="20" y="24" width="960" height="160"/>
  <rect class="in" x="20" y="42" width="960" height="124"/>
  <rect class="eq" x="60" y="52" width="40" height="34" rx="6"/><rect class="eq" x="110" y="52" width="40" height="34" rx="6"/><rect class="eq" x="160" y="52" width="40" height="34" rx="6"/>
  <rect class="eq" x="60" y="122" width="40" height="34" rx="6"/><rect class="eq" x="110" y="122" width="40" height="34" rx="6"/><rect class="eq" x="160" y="122" width="40" height="34" rx="6"/>
  <rect class="eq" x="250" y="52" width="40" height="34" rx="6"/><rect class="eq" x="300" y="52" width="40" height="34" rx="6"/><rect class="eq" x="350" y="52" width="40" height="34" rx="6"/>
  <rect class="eq" x="250" y="122" width="40" height="34" rx="6"/><rect class="eq" x="300" y="122" width="40" height="34" rx="6"/><rect class="eq" x="350" y="122" width="40" height="34" rx="6"/>
  <!-- sol du hangar -->
  <path class="ln" d="M20 670 L980 670"/>
  <!-- local de réception -->
  <path class="ln2" d="M20 420 L290 420 L290 510 M290 610 L290 670"/>

  <g data-part="depose">
    <rect class="okf" x="730" y="56" width="210" height="96" rx="8"/>
    <path class="dash" d="M746 72 L924 72 L924 136 L746 136 Z"/>
  </g>
  <g data-part="porte-avion">
    <rect class="wh" x="560" y="160" width="100" height="30"/>
    <path class="ln2" d="M560 160 L560 190 M660 160 L660 190"/>
    <rect class="fl" x="566" y="166" width="88" height="18"/>
  </g>
  <g data-part="passerelle">
    <rect class="mt" x="566" y="192" width="88" height="156"/>
    <path class="thin" d="M566 218 L654 218 M566 244 L654 244 M566 270 L654 270 M566 296 L654 296 M566 322 L654 322"/>
    <path class="ln2" d="M566 192 L566 348 M654 192 L654 348"/>
  </g>
  <g data-part="zone-attente">
    <rect class="wh" x="530" y="372" width="160" height="96" rx="6"/>
    <rect class="dash" x="540" y="382" width="140" height="76" rx="4"/>
  </g>
  <g data-part="depart">
    <rect class="fl" x="50" y="492" width="150" height="140" rx="6"/>
    <rect class="in" x="66" y="508" width="118" height="108" rx="6"/>
    <path class="thin" d="M66 562 L184 562 M125 508 L125 616"/>
  </g>
  <g data-part="porte">
    <rect class="none" pointer-events="all" x="256" y="506" width="70" height="108"/>
    <path class="ln2" d="M290 510 L290 524 M290 596 L290 610"/>
    <path class="dim" d="M312 528 L312 592"/>
    <path class="dimf" d="M312 514 L302 534 L322 534 Z M312 606 L302 586 L322 586 Z"/>
  </g>
  <g data-part="cable-sol">
    <rect class="none" pointer-events="all" x="356" y="476" width="70" height="170"/>
    <path class="sy" d="M384 476 C404 520 372 560 398 600 C408 620 392 636 396 646"/>
  </g>
  <g data-part="obstacle">
    <rect class="mt2" x="454" y="516" width="96" height="92" rx="8"/>
    <rect class="dk" x="466" y="528" width="72" height="68" rx="4"/>
    <circle class="dk" cx="462" cy="524" r="9"/><circle class="dk" cx="542" cy="524" r="9"/><circle class="dk" cx="462" cy="600" r="9"/><circle class="dk" cx="542" cy="600" r="9"/>
  </g>
  <g data-part="issue">
    <rect class="wh" x="760" y="560" width="150" height="104"/>
    <path class="thin" d="M760 600 L800 560 M760 650 L850 560 M796 664 L900 560 M846 664 L910 600 M896 664 L910 650"/>
    <rect class="dash" x="760" y="560" width="150" height="104"/>
    <rect class="okf" x="790" y="656" width="90" height="18" rx="3"/>
  </g>

  <!-- trajet -->
  <path class="dim" stroke-dasharray="20 14" d="M200 560 L430 560 C440 500 470 480 520 480 L560 470 L610 440 L610 100 L720 100"/>
  <path class="dimf" d="M742 100 L712 86 L712 114 Z"/>
  <path class="dimf" d="M262 560 L236 548 L236 572 Z"/>

  <g class="badges">
    <g class="badge" data-badge="depart" transform="translate(60 490)"><circle class="bd" r="24"/><text class="bn">1</text></g>
    <g class="badge" data-badge="porte" transform="translate(262 470)"><circle class="bd" r="24"/><text class="bn">2</text></g>
    <g class="badge" data-badge="cable-sol" transform="translate(372 450)"><circle class="bd" r="24"/><text class="bn">3</text></g>
    <g class="badge" data-badge="obstacle" transform="translate(502 562)"><circle class="bd" r="24"/><text class="bn">4</text></g>
    <g class="badge" data-badge="issue" transform="translate(836 606)"><circle class="bd" r="24"/><text class="bn">5</text></g>
    <g class="badge" data-badge="zone-attente" transform="translate(700 420)"><circle class="bd" r="24"/><text class="bn">6</text></g>
    <g class="badge" data-badge="passerelle" transform="translate(680 270)"><circle class="bd" r="24"/><text class="bn">7</text></g>
    <g class="badge" data-badge="porte-avion" transform="translate(530 176)"><circle class="bd" r="24"/><text class="bn">8</text></g>
    <g class="badge" data-badge="depose" transform="translate(900 104)"><circle class="bd" r="24"/><text class="bn">9</text></g>
  </g>
</svg>
