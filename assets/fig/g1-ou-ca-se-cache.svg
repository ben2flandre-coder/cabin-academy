<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Où se cachent les objets : coupe au niveau du plancher</title>
  <desc id="d">Scène de recherche, schéma de principe en coupe. À gauche, la peau et un cadre du fuselage, puis le panneau latéral et le panneau bas à grille ; entre le cadre et le panneau, un chiffon taché est resté coincé. Sur le plancher : un sachet d'emballage vide froissé, et un bac à visserie compartimenté contenant des vis. Deux rails de siège coupés montrent leur gorge : une vis est couchée au fond du premier ; dans le second est verrouillé le pied d'un siège. Sous le plancher, sous la traverse : un faisceau tenu par un collier ; une rondelle et un écrou posés sur le fond ; un tube fermé par un capuchon de couleur vive ; un conduit dont l'extrémité ouverte laisse voir une queue de serre-câble.</desc>
