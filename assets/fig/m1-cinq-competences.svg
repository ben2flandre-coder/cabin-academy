  <path class="dimf" d="M896 392 L882 414 L910 414 Z"/>
  <g data-part="controle"><rect class="wh" x="24" y="420" width="938" height="84" rx="18"/><circle class="gl" cx="76" cy="458" r="20"/><path class="ln2" d="M90 472 L108 490"/><text class="t" x="132" y="476">Contrôler à chaque étape</text></g>
  <g data-part="trace"><rect class="wh" x="24" y="522" width="938" height="84" rx="18"/><rect class="in" x="56" y="540" width="36" height="48" rx="4"/><line class="thin" x1="63" y1="554" x2="85" y2="554"/><line class="thin" x1="63" y1="566" x2="85" y2="566"/><path class="mt2" d="M84 584 L112 548 L120 554 L92 590 Z"/><text class="t" x="132" y="578">Tracer ce qui est fait</text></g>
