<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" class="fig" role="img" aria-labelledby="t d">
  <title id="t">Les cinq compétences du CQP, dans l'ordre du travail</title>
  <desc id="d">Schéma de principe : cinq cases en forme de flèche, alignées de gauche à droite et marquées C1 à C5. Une accolade réunit C1, C2 et C3 sous le nom BC01 ; une autre réunit C4 et C5 sous le nom BC02. Chaque case contient un dessin : C1, une feuille de document et un repère de position ; C2, un bouclier de protection ; C3, un chariot portant un carton ; C4, une plaque boulonnée et une clé ; C5, deux connecteurs reliés à des câbles orange. Sous les cinq cases, deux bandes les soulignent sur toute la largeur : contrôler à chaque étape, puis tracer ce qui est fait.</desc>
  <rect class="bgp" width="1000" height="630"/>
  <g data-part="c1"><path class="in" d="M24 130 L182 130 L210 250 L182 370 L24 370 Z"/><text class="tl tc" x="120" y="192">C1</text><rect class="wh" x="76" y="238" width="62" height="84" rx="5"/><line class="thin" x1="86" y1="256" x2="128" y2="256"/><line class="thin" x1="86" y1="272" x2="128" y2="272"/><line class="thin" x1="86" y1="288" x2="128" y2="288"/><path class="syf" d="M146 330 C122 302 124 268 146 268 C168 268 170 302 146 330 Z"/><circle class="wh" cx="146" cy="286" r="7"/></g>
  <g data-part="c2"><path class="in" d="M212 130 L370 130 L398 250 L370 370 L212 370 L240 250 Z"/><text class="tl tc" x="314" y="192">C2</text><path class="eq" d="M314 236 L356 250 L356 288 C356 314 336 330 314 338 C292 330 272 314 272 288 L272 250 Z"/><rect class="wh" x="294" y="262" width="40" height="44" rx="4"/></g>
  <g data-part="c3"><path class="in" d="M400 130 L558 130 L586 250 L558 370 L400 370 L428 250 Z"/><text class="tl tc" x="502" y="192">C3</text><rect class="fl" x="474.7" y="252.5" width="63" height="52.5" rx="3"/><line class="thin" x1="506.2" y1="252.5" x2="506.2" y2="305"/><path class="ln2" d="M441.1 237.8 L455.8 237.8 L455.8 307.1 L546.1 307.1"/><circle class="dk" cx="474.7" cy="321.8" r="10"/><circle class="dk" cx="529.3" cy="321.8" r="10"/></g>
  <g data-part="c4"><path class="wh" d="M588 130 L746 130 L774 250 L746 370 L588 370 L616 250 Z"/><text class="tl tc" x="690" y="192">C4</text><rect class="st" x="640" y="296" width="100" height="24" rx="3"/><rect class="mt2" x="654" y="278" width="28" height="20" rx="3"/><rect class="mt2" x="698" y="278" width="28" height="20" rx="3"/><g transform="translate(712 270) rotate(-52)"><path class="mt" d="M18 -7 L78 -7 L78 7 L18 7 C16 16 5 19 -6 14 L4 5 L4 -5 L-6 -14 C5 -19 16 -16 18 -7 Z"/></g></g>
  <g data-part="c5"><path class="wh" d="M776 130 L934 130 L962 250 L934 370 L776 370 L804 250 Z"/><text class="tl tc" x="878" y="192">C5</text><path class="sy" d="M816 324 C816 284 828 284 840 284"/><path class="sy" d="M940 244 C940 284 928 284 916 284"/><rect class="mt" x="838" y="266" width="30" height="36" rx="4"/><rect class="mt2" x="868" y="276" width="8" height="5"/><rect class="mt2" x="868" y="287" width="8" height="5"/><rect class="mt2" x="886" y="264" width="32" height="40" rx="4"/><circle class="dk" cx="894" cy="278" r="3"/><circle class="dk" cx="894" cy="290" r="3"/></g>
  <path class="ln" d="M24 112 L24 96 L586 96 L586 112"/><text class="tb tc" x="305" y="72">BC01</text><path class="ln" d="M590 112 L590 96 L962 96 L962 112"/><text class="tb tc" x="776" y="72">BC02</text>
  <path class="dimf" d="M144 392 L130 414 L158 414 Z"/>
  <path class="dimf" d="M332 392 L318 414 L346 414 Z"/>
  <path class="dimf" d="M520 392 L506 414 L534 414 Z"/>
